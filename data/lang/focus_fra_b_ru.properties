# Переводы дерева фокусов fra_b (страна появляется при гражданской войне).
# Русский текст в ключе, английский - в ключе с _EN.

BE2_F_FRAB_ARMY = Великая армия
BE2_F_FRAB_ARMY_EN = The Grande Armée
BE2_F_FRAB_ART = Императорские залы
BE2_F_FRAB_ART_EN = Imperial Halls
BE2_F_FRAB_ATLANTIC = Атлантическое побережье
BE2_F_FRAB_ATLANTIC_EN = The Atlantic Coast
BE2_F_FRAB_BANK = Имперский банк
BE2_F_FRAB_BANK_EN = The Imperial Bank
BE2_F_FRAB_CANAL = Каналы и порты
BE2_F_FRAB_CANAL_EN = Canals and Ports
BE2_F_FRAB_CAVALRY = Тяжёлая кавалерия
BE2_F_FRAB_CAVALRY_EN = Heavy Cavalry
BE2_F_FRAB_COLONY = Заморские владения
BE2_F_FRAB_COLONY_EN = Overseas Possessions
BE2_F_FRAB_DRAGOONS = Императорские драгуны
BE2_F_FRAB_DRAGOONS_EN = Imperial Dragoons
BE2_F_FRAB_EDUCATION = Императорские школы
BE2_F_FRAB_EDUCATION_EN = Imperial Schools
BE2_F_FRAB_EMPIREWAR = Империальная война
BE2_F_FRAB_EMPIREWAR_EN = Imperial War
BE2_F_FRAB_FORTRESS = Стоянки и крепости
BE2_F_FRAB_FORTRESS_EN = Barracks and Fortresses
BE2_F_FRAB_HEXAGONE = Шестиугольник
BE2_F_FRAB_HEXAGONE_EN = The Hexagon
BE2_F_FRAB_INDUSTRY = Имперская промышленность
BE2_F_FRAB_INDUSTRY_EN = Imperial Industry
BE2_F_FRAB_LEGION = Почётный легион
BE2_F_FRAB_LEGION_EN = The Legion of Honour
BE2_F_FRAB_LEGITIMACY = Династия
BE2_F_FRAB_LEGITIMACY_EN = The Dynasty
BE2_F_FRAB_MARCH = Выход из Парижа
BE2_F_FRAB_MARCH_EN = Out of Paris
BE2_F_FRAB_MEDITERRANEE = Средиземноморье
BE2_F_FRAB_MEDITERRANEE_EN = The Mediterranean
BE2_F_FRAB_MEMORY = Память империи
BE2_F_FRAB_MEMORY_EN = Memory of the Empire
BE2_F_FRAB_MINISTRY = Министерство имперских дел
BE2_F_FRAB_MINISTRY_EN = Ministry of Imperial Affairs
BE2_F_FRAB_ORDER = Полиция империи
BE2_F_FRAB_ORDER_EN = The Imperial Police
BE2_F_FRAB_PLEBISCITE = Плебисцит
BE2_F_FRAB_PLEBISCITE_EN = Plebiscite
BE2_F_FRAB_RAIL = Железные дороги
BE2_F_FRAB_RAIL_EN = Railways
BE2_F_FRAB_RHONE = Долина Роны
BE2_F_FRAB_RHONE_EN = The Rhône Valley
BE2_F_FRAB_SCIENCE = Академия наук
BE2_F_FRAB_SCIENCE_EN = Academy of Sciences
BE2_F_FRAB_SENATE = Сенат
BE2_F_FRAB_SENATE_EN = The Senate

BE2_FD_FRAB_ARMY = Империя начинается с армии: под знаменем из Парижа собирают тех, кто готов идти на восток, и тех, кто не готов, но молчит.
BE2_FD_FRAB_ARMY_EN = An empire begins with an army: under the banner from Paris they gather those ready to march east, and those not ready but silent.
BE2_FD_FRAB_ART = Музеи и залы, где картина должника висит выше карты маршала. Вкус империи - это тоже политика.
BE2_FD_FRAB_ART_EN = Museums and halls where a debtor’s painting hangs above a marshal’s map. The empire’s taste is politics too.
BE2_FD_FRAB_ATLANTIC = Бордо и река, на которой держалась вся торговля юга. Гавань становится второй столицей.
BE2_FD_FRAB_ATLANTIC_EN = Bordeaux and the river that carried all southern trade. The harbour becomes a second capital.
BE2_FD_FRAB_BANK = Деньги начинают ходить по стране, а не только по столам министров. Империя берёт в долг у будущего и называет это инвестицией.
BE2_FD_FRAB_BANK_EN = Money starts moving through the country, not only across ministers’ desks. The empire borrows from the future and calls it investment.
BE2_FD_FRAB_CANAL = Вода вместо дороги: дешевле, медленнее и не боится блокады.
BE2_FD_FRAB_CANAL_EN = Water instead of roads: cheaper, slower, and not afraid of a blockade.
BE2_FD_FRAB_CAVALRY = Конница решает то, чего не решают числа: расстояние и настроение приграничных гарнизонов.
BE2_FD_FRAB_CAVALRY_EN = Cavalry settles what numbers cannot: distance and the mood of the border garrisons.
BE2_FD_FRAB_COLONY = Страна снова покупает земли за морем, не веря в метрополию, но не проверяя её. Товары идут морем, а письма - тоже.
BE2_FD_FRAB_COLONY_EN = The country buys lands across the sea again, not trusting the metropole but not checking it either. Goods travel by sea, and so do letters.
BE2_FD_FRAB_DRAGOONS = Солдаты получают имена, мундиры и генерал'ские пенсии. Дисциплина стоит дороже, но армия перестаёт разбегаться сама.
BE2_FD_FRAB_DRAGOONS_EN = Soldiers get names, uniforms and pensions. Discipline is expensive, but the army stops running away on its own.
BE2_FD_FRAB_EDUCATION = Учебник пишут так, чтобы через двадцать лет никто не помнил, кто был настоящим императором.
BE2_FD_FRAB_EDUCATION_EN = The textbooks are written so that in twenty years nobody remembers who the real emperor was.
BE2_FD_FRAB_EMPIREWAR = Империя объявляет войну не ради границы, а ради того, чтобы граница была везде. Дорого, долго и по-старому.
BE2_FD_FRAB_EMPIREWAR_EN = The empire declares war not for a border but to have borders everywhere. Expensive, long, and old-fashioned.
BE2_FD_FRAB_FORTRESS = Каждый город второй столицы становится складом, а каждый мост на дороге из Парижа - воротами. Страна, которую нельзя быстро пройти, живёт дольше.
BE2_FD_FRAB_FORTRESS_EN = Every city of the second capital becomes a warehouse and every bridge on the road from Paris a gate. A country that cannot be crossed quickly lives longer.
BE2_FD_FRAB_HEXAGONE = Границы империи совпадают с границами той страны, которая её породила. Круг замкнулся, и это стоит дороже, чем казалось.
BE2_FD_FRAB_HEXAGONE_EN = The empire’s borders match those of the country that produced it. The circle is closed, and it cost more than it seemed.
BE2_FD_FRAB_INDUSTRY = Заводы строят то, что нужно армии, а то, что можно продать, - в перерыв между войнами.
BE2_FD_FRAB_INDUSTRY_EN = Plants build what the army needs; what can be sold is built in the pause between wars.
BE2_FD_FRAB_LEGION = Награда за службу, которая ничего не стоит правительству и стоит слишком много награждённым.
BE2_FD_FRAB_LEGION_EN = A reward for service that costs the government nothing and costs the decorated far too much.
BE2_FD_FRAB_LEGITIMACY = Трон становится не местом, а обещанием: наследник есть, и это снимает вопрос о том, что будет после.
BE2_FD_FRAB_LEGITIMACY_EN = The throne becomes not a place but a promise: there is an heir, and that settles the question of what comes after.
BE2_FD_FRAB_MARCH = Страна, запертая в двух городах, начинает смотреть на карту. Провинции соседей становятся вопросом, на который рано или поздно отвечают.
BE2_FD_FRAB_MARCH_EN = A country shut in two cities starts looking at a map. The neighbours’ provinces become a question that is answered sooner or later.
BE2_FD_FRAB_MEDITERRANEE = Порт на юге даёт флот и экспорт, а вместе с ними - прямой путь в Африку и обратно.
BE2_FD_FRAB_MEDITERRANEE_EN = A southern port gives a fleet and exports, and with them a direct road to Africa and back.
BE2_FD_FRAB_MEMORY = Страна решает, что помнить, и выселяет из памяти всё остальное. Границы после этого проще защищать: они проходят по памяти.
BE2_FD_FRAB_MEMORY_EN = The country decides what to remember and moves everything else out of memory. Borders are easier to defend afterwards: they run through memory.
BE2_FD_FRAB_MINISTRY = Каждая область получает своего чиновника из Парижа и отчёт, который идёт обратно в Париж. Управление дорожает и перестаёт спорить само.
BE2_FD_FRAB_MINISTRY_EN = Every region gets an official from Paris and a report that goes back to Paris. Rule gets more expensive and stops arguing with itself.
BE2_FD_FRAB_ORDER = Порядок, который держится на жандармах, а не на согласии. Города становятся тише, и в тишине слышно, где именно недовольны.
BE2_FD_FRAB_ORDER_EN = Order kept by gendarmes rather than consent. Cities get quieter, and in the quiet one hears exactly where the discontent is.
BE2_FD_FRAB_PLEBISCITE = Вопрос задают прямо и вслух, и страна отвечает вслух же. Ответ заранее известен, но он был заранее объявлен, и это главное.
BE2_FD_FRAB_PLEBISCITE_EN = The question is asked plainly and aloud, and the country answers aloud. The answer was known in advance, but it was announced in advance, and that is the main thing.
BE2_FD_FRAB_RAIL = Линия Париж - Лион превращается в линию Париж - везде. Страна с рельсами приезжает раньше, чем приходят вести о войне.
BE2_FD_FRAB_RAIL_EN = The Paris-Lyon line becomes the Paris-everywhere line. A country with rails arrives before the news of war does.
BE2_FD_FRAB_RHONE = Первая земля за Лионом: виноградники, мосты и города, которые до этого принадлежали другой империи.
BE2_FD_FRAB_RHONE_EN = The first land past Lyon: vineyards, bridges and towns that until now belonged to another empire.
BE2_FD_FRAB_SCIENCE = Учёные получают то, чего не получали их коллеги при прошлой власти: отдельные здания и тишину.
BE2_FD_FRAB_SCIENCE_EN = Scholars get what their colleagues did not get under the last government: separate buildings and quiet.
BE2_FD_FRAB_SENATE = Собрание, где все сидят, все молчат и все выходят с одинаковым лицом. Управлять таким собранием проще, чем страной.
BE2_FD_FRAB_SENATE_EN = An assembly where everyone sits, everyone is silent, and everyone leaves with the same face. Governing such an assembly is easier than governing a country.
