# Переводы новых фокусов Федерации Россия (35 фокусов).
# Вливается в game/languages/focus/Bundle_ru.properties скриптом tools/merge_props.py.

# ===================== ГОСУДАРСТВЕННОСТЬ =====================
BE2_F_RUSI_USTAV = Конституция федерации
BE2_F_RUSI_USTAV_EN = The Federal Constitution
BE2_FD_RUSI_USTAV = Утверждается конституция: республики получают равные права, центр ограничен, а страна становится союзом суверенных государств со своим гимном и гербом. Власть прочнее, управление слабее, в казну идут первые налоги по новому уставу.
BE2_FD_RUSI_USTAV_EN = A constitution is adopted: the republics get equal rights, the centre is limited, and the country becomes a union of sovereign states with its own anthem and emblem. The government grows more solid, administration weakens, and the treasury gets its first taxes under the new charter.

BE2_F_RUSI_FEDREP = Федерация республик
BE2_F_RUSI_FEDREP_EN = Federation of the Republics
BE2_FD_RUSI_FEDREP = Границы полномочий центра и республик закреплены договором, спорные земли делятся по ревизии. Управление страной ускоряется, призывной ресурс растёт, а республики сами собирают людей и податчиков.
BE2_FD_RUSI_FEDREP_EN = The limits of central and republican authority are fixed by a treaty, and disputed lands are divided after a survey. Administration speeds up, the recruitable population grows, and the republics raise men and taxes on their own.

BE2_F_RUSI_SELOVET = Местное самоуправление
BE2_F_RUSI_SELOVET_EN = Local Self-Government
BE2_FD_RUSI_SELOVET = Города и области получают свои управы, бюджеты и выборные органы, часть налогов остаётся на месте. Центр перестаёт управлять всем сам, управленческие расходы падают, в городах становится спокойнее.
BE2_FD_RUSI_SELOVET_EN = Cities and provinces get their own administrations, budgets and elected boards, and part of the taxes stays local. The centre stops managing everything itself, administrative costs fall, and the cities grow calmer.

BE2_F_RUSI_SUDY = Суды и правосудие
BE2_F_RUSI_SUDY_EN = Courts and Justice
BE2_FD_RUSI_SUDY = Народные суды и независимая прокуратура заменяют трибуналы военного времени, дела разбираются открыто. Власть страны становится прочнее, управление ровнее, а люди верят суду.
BE2_FD_RUSI_SUDY_EN = People's courts and an independent prosecutor's office replace the wartime tribunals, and cases are heard in public. The state grows more stable, administration more even, and people begin to trust the courts.

BE2_F_RUSI_GLASNOST = Гласность и печать
BE2_F_RUSI_GLASNOST_EN = Free Speech and the Press
BE2_FD_RUSI_GLASNOST = Цензура отменяется, газеты и радио говорят открыто, появляются свободные радиостанции и телевидение. Исследования идут бодрее, недовольство гаснет, а мир начинает считаться с мнением новой столицы.
BE2_FD_RUSI_GLASNOST_EN = Censorship is lifted, newspapers and radio speak freely, and independent radio stations and television appear. Research grows livelier, discontent dies down, and the world starts taking the opinion of the new capital into account.

BE2_F_RUSI_VYBORY = Свободные выборы
BE2_F_RUSI_VYBORY_EN = Free Elections
BE2_FD_RUSI_VYBORY = Избирательные комиссии независимы, голосование тайное и всеобщее, партии соревнуются за голоса избирателей. Власть укрепляется, связи с соседями теплеют, а страна получает очки дипломатии.
BE2_FD_RUSI_VYBORY_EN = Electoral commissions are independent, voting is secret and universal, and parties compete for the voters. The government is strengthened, ties with neighbours warm, and the country gains diplomacy points.

BE2_F_RUSI_PARLAMENT = Парламентская республика
BE2_F_RUSI_PARLAMENT_EN = Parliamentary Republic
BE2_FD_RUSI_PARLAMENT = Вместо одного собрания появляется постоянный парламент, а правительство отвечает перед ним. Страна переходит к парламентской республике: управление быстрее, власть прочнее, никто не остаётся без контроля.
BE2_FD_RUSI_PARLAMENT_EN = A permanent parliament replaces the single assembly, and the government answers to it. The country becomes a parliamentary republic: administration is faster, the government more solid, and nobody stays unchecked.

BE2_F_RUSI_SOBRANA = Народное собрание
BE2_F_RUSI_SOBRANA_EN = The People's Assembly
BE2_FD_RUSI_SOBRANA = Полномочия переходят народному собранию, где все решения голосуются открыто и на виду у избирателей. Страна становится прямой демократией, наука получает поддержку снизу, а недовольство уходит совсем.
BE2_FD_RUSI_SOBRANA_EN = Power passes to a people's assembly where every decision is voted in the open, in full view of the voters. The country becomes a direct democracy, science is backed from below, and discontent disappears completely.

BE2_F_RUSI_VOENKOM = Возврат однопартийности
BE2_F_RUSI_VOENKOM_EN = Return to the Single Party
BE2_FD_RUSI_VOENKOM = Партия снова остаётся единственной, выборы отменяются, армия получает прямое командование. Страна становится диктатурой пролетариата: содержание армии падает вдвое, но народ недоволен.
BE2_FD_RUSI_VOENKOM_EN = The party is once again the only one, elections are cancelled, and the army gets direct command. The country becomes a dictatorship of the proletariat: army upkeep halves, but the people are unhappy.

# ===================== ЭКОНОМИКА =====================
BE2_F_RUSI_DENREFORM = Денежная и налоговая реформа
BE2_F_RUSI_DENREFORM_EN = Monetary and Tax Reform
BE2_FD_RUSI_DENREFORM = Старые деньги обмениваются на новые, цены удерживаются в узде, а налоги пересчитываются по новой шкале. В казне становится больше денег, страна успокаивается, торговля считает по новым правилам.
BE2_FD_RUSI_DENREFORM_EN = Old money is exchanged for new, prices are held in check and taxes are recalculated on a new scale. The treasury gets more money, the country calms down, and trade follows the new rules.

BE2_F_RUSI_TORGOVLA = Частная торговля
BE2_F_RUSI_TORGOVLA_EN = Private Trade
BE2_FD_RUSI_TORGOVLA = Лавки, рынки и частные конторы возвращаются, купцы торгуют без согласования с планом и сами закупают товар. Доходы страны растут, люди возвращаются к торговле, а в казне появляются живые деньги.
BE2_FD_RUSI_TORGOVLA_EN = Shops, markets and private counting houses return, and merchants trade without asking the plan for permission. The country's income grows, people go back to trading, and real money appears in the treasury.

BE2_F_RUSI_KOLHOS = Колхозы и совхозы
BE2_F_RUSI_KOLHOS_EN = Collective and State Farms
BE2_FD_RUSI_KOLHOS = Колхозы получают землю в постоянное пользование и свободу распоряжаться урожаем, совхозы остаются на государственном содержании. Еды больше, население растёт, а крестьянство не бунтует.
BE2_FD_RUSI_KOLHOS_EN = Collective farms get land in permanent use and freedom to dispose of their harvest, while state farms stay on the state's books. More food, a growing population, and the peasants do not riot.

BE2_F_RUSI_PRIVAT = Промкооперация и приватизация
BE2_F_RUSI_PRIVAT_EN = Cooperatives and Privatisation
BE2_FD_RUSI_PRIVAT = Мелкие заводы, мастерские и лавки переходят к промкооперативам и частным хозяевам, часть станций можно выкупить. Доходы и налоги растут, страна получает деньги из частных рук, а металл и уголь не уходят на дефицит.
BE2_FD_RUSI_PRIVAT_EN = Small plants, workshops and shops pass to cooperatives and private owners, and part of them can be bought outright. Income and taxes grow, the country gets money from private hands, and metal and coal no longer go missing.

BE2_F_RUSI_NEFTEGAZ = Нефть Баку и Сибири
BE2_F_RUSI_NEFTEGAZ_EN = The Oil of Baku and Siberia
BE2_FD_RUSI_NEFTEGAZ = Разработка каспийской нефти, сибирские месторождения и первый газопровод дают стране сырьё и топливо. В казну идёт прибыль, технике и армии хватает горючего, а страна быстрее перемещается по своим просторам.
BE2_FD_RUSI_NEFTEGAZ_EN = Development of the Caspian oil, the Siberian fields and a first gas pipeline give the country raw materials and fuel. Profit flows into the treasury, the army and its machines have enough fuel, and the country moves faster across its own expanse.

BE2_F_RUSI_DNEPRO = Днепропетровск и Магнитогорск
BE2_F_RUSI_DNEPRO_EN = Dnepropetrovsk and Magnitogorsk
BE2_FD_RUSI_DNEPRO = Стальные заводы Днепропетровска и Магнитогорска расширяются, новые дома строятся быстрее. Страна получает металл, города растут и забирают половину рабочих рук у деревни, а заводы выходят на полную мощность.
BE2_FD_RUSI_DNEPRO_EN = The steel plants of Dnepropetrovsk and Magnitogorsk are expanded and new houses go up faster. The country gets metal, the cities grow and take half the working hands from the countryside, and the plants run at full power.

BE2_F_RUSI_ZHDOROGI = Железные дороги
BE2_F_RUSI_ZHDOROGI_EN = The Railways
BE2_FD_RUSI_ZHDOROGI = Восстанавливаются старые линии, строятся новые, мосты и станции, составы ходят по графику. Страна перестаёт буксовать на месте: войска и грузы идут быстро, управление дорогами обходится дешевле.
BE2_FD_RUSI_ZHDOROGI_EN = Old lines are repaired and new ones, bridges and stations are built, and trains run to a timetable. The country stops getting stuck in one place: troops and goods move fast and running the railways becomes cheaper.

# ===================== АРМИЯ =====================
BE2_F_RUSI_SOKRASH = Сокращение армии
BE2_F_RUSI_SOKRASH_EN = Cutting the Army Down
BE2_FD_RUSI_SOKRASH = Мирная армия втрое меньше прежней: общая мобилизация отменена, миллионы солдат возвращаются к станкам и полям. Содержание войск падает, в народ и в строй уходят деньги, которые раньше уходили в убытки.
BE2_FD_RUSI_SOKRASH_EN = The peacetime army is three times smaller: general mobilisation is cancelled and millions of soldiers go back to the factories and fields. Army upkeep falls and the money that used to vanish now goes into the army and the people.

BE2_F_RUSI_OFFICERKORP = Реформа офицерского корпуса
BE2_F_RUSI_OFFICERKORP_EN = Reform of the Officer Corps
BE2_FD_RUSI_OFFICERKORP = Старые звания и классовые привилегии ликвидируются, офицеры учатся в академиях и служат по контракту с проверкой командиров. Наступление и оборона становятся организованнее, а техника используется умелее.
BE2_FD_RUSI_OFFICERKORP_EN = Old ranks and class privileges are abolished, officers study at academies and serve on contract with review by their commanders. Assault and defence become better organised and equipment is used more skilfully.

BE2_F_RUSI_ZAPAD = Безопасность западных рубежей
BE2_F_RUSI_ZAPAD_EN = The Western Lines
BE2_FD_RUSI_ZAPAD = Линия укреплений, противотанковые рвы и заминированные поля на всём западном подходе, пограничные войска на ключевых переходах. Прорваться почти невозможно, но содержание всего этого обходится дорого.
BE2_FD_RUSI_ZAPAD_EN = A line of fortifications, anti-tank ditches and minefields along the whole western approach, with border troops on the key crossings. Breaking through is almost impossible, but all of this costs a great deal to keep.

BE2_F_RUSI_BRONETANK = Бронетанковые войска
BE2_F_RUSI_BRONETANK_EN = Armoured and Tank Troops
BE2_FD_RUSI_BRONETANK = Кавалерия и лёгкая пехота уходят с поля боя, их место занимают танковые и мотопехотные корпуса. Войска двигаются намного быстрее, а удары бьют глубже и тяжелее.
BE2_FD_RUSI_BRONETANK_EN = Cavalry and light infantry leave the battlefield and tank and motorised corps take their place. Troops move far faster and strikes hit deeper and harder.

BE2_F_RUSI_AVIA = Восстановление авиации
BE2_F_RUSI_AVIA_EN = Rebuilding the Air Force
BE2_FD_RUSI_AVIA = Авиационный завод даёт поток самолётов, открываются лётные школы и строятся новые авиаполки. Удар с воздуха становится главным оружием, а наступление идёт быстрее.
BE2_FD_RUSI_AVIA_EN = An aircraft plant turns out a stream of aeroplanes, flying schools open and new air bases are built. The strike from the air becomes the main weapon, and the advance moves faster.

BE2_F_RUSI_DALNAYA = Дальняя авиация
BE2_F_RUSI_DALNAYA_EN = Long-Range Aviation
BE2_FD_RUSI_DALNAYA = Тяжёлые самолёты перелетают тысячи километров и достают противника там, где нет линии фронта. Страна может ударить где угодно и при этом похвастаться дипломатией, но самолёты требуют горючего и ремонта.
BE2_FD_RUSI_DALNAYA_EN = Heavy aircraft fly thousands of kilometres and reach the enemy where there is no front line. The country can strike anywhere and boast of its diplomacy, but the aircraft need fuel and maintenance.

BE2_F_RUSI_PRIBALT = Освобождение Прибалтики
BE2_F_RUSI_PRIBALT_EN = Liberation of the Baltic
BE2_FD_RUSI_PRIBALT = Прибалтийские земли с портами и флотом переходят под управление федерации. Население и живое мясо растут, армия получает готовую инфраструктуру, но соседи перестают разговаривать.
BE2_FD_RUSI_PRIBALT_EN = The Baltic lands with their ports and fleets come under the federation's control. Population and manpower grow and the army gets a ready-made infrastructure, but the neighbours stop talking.

# ===================== НАУКА И ТЕХНИКА =====================
BE2_F_RUSI_NAUKA = Академии и институты
BE2_F_RUSI_NAUKA_EN = Academies and Institutes
BE2_FD_RUSI_NAUKA = Академия наук и отраслевые институты получают помещения, приборы и защиту от ведомственных споров. Исследования идут быстрее, в институты приходят студенты, а молодые специалисты уезжают из столицы в провинцию.
BE2_FD_RUSI_NAUKA_EN = The academy of sciences and the branch institutes get premises, instruments and protection from departmental quarrels. Research moves faster, students come to the institutes, and young specialists leave the capital for the provinces.

BE2_F_RUSI_DNEPRGES = Днепрогэс
BE2_F_RUSI_DNEPRGES_EN = The Dnieper Hydroelectric Station
BE2_FD_RUSI_DNEPRGES = Плотина и электростанция на Днепре дают стране дешёвую энергию, а для расчётов приглашают первые вычислительные машины. Заводы и города получают свет и воду, еда и доходы растут, наука продвигается.
BE2_FD_RUSI_DNEPRGES_EN = The dam and power station on the Dnieper give the country cheap energy, and the first calculating machines are brought in for the work. Plants and cities get light and water, food and income grow, and science advances.

BE2_F_RUSI_ATOMPROEKT = Атомный проект
BE2_F_RUSI_ATOMPROEKT_EN = The Atomic Project
BE2_FD_RUSI_ATOMPROEKT = Строительство реактора, завода по разделению и секретных лабораторий забирает половину казны и половину лучших инженеров. Зато страна получает собственную бомбу, научную базу и уважение всех, кто разбирается в физике.
BE2_FD_RUSI_ATOMPROEKT_EN = Building a reactor, a separation plant and secret laboratories takes half the treasury and half the best engineers. In return the country gets a bomb of its own, a scientific base and the respect of everyone who understands physics.

BE2_F_RUSI_RAKETY = Ракетная программа
BE2_F_RUSI_RAKETY_EN = The Rocket Programme
BE2_FD_RUSI_RAKETY = Стенды, полигоны и заводы делают первые боевые ракеты дальнего действия. Страна получает оружие, которое не сбивают зениткой, и удар с воздуха становится тяжелее, но каждый запуск стоит очень дорого.
BE2_FD_RUSI_RAKETY_EN = Test stands, proving grounds and plants turn out the first long-range combat rockets. The country gets a weapon that cannot be shot down by anti-aircraft fire and the strike from the air grows heavier, but every launch costs a great deal.

BE2_F_RUSI_SPUTNIK = Первый спутник
BE2_F_RUSI_SPUTNIK_EN = The First Satellite
BE2_FD_RUSI_SPUTNIK = Ракета выносит на орбиту небольшой спутник с приёмником, и его сигналы слышат по всей стране. Престиж и наука уходят вверх, весь мир смотрит на новую державу с удивлением, а внутри страны крепнет вера в своё будущее.
BE2_FD_RUSI_SPUTNIK_EN = A rocket puts a small satellite with a receiver into orbit, and its signals are heard all over the country. Prestige and science rise, the whole world watches the new state with surprise, and faith in the future grows at home.

BE2_F_RUSI_KOSMOS = Полёт человека в космос
BE2_F_RUSI_KOSMOS_EN = The First Man in Space
BE2_FD_RUSI_KOSMOS = Самолёт выводится на орбиту, человек выходит наружу и возвращается живым. Страна получает звание великой державы, науку мирового уровня и народ, который поверил в своё будущее.
BE2_FD_RUSI_KOSMOS_EN = A spacecraft is put into orbit, a man goes outside and comes back alive. The country gains the title of a great power, science on a world level, and a people who believe in its future.

# ===================== ВНЕШНЯЯ ПОЛИТИКА =====================
BE2_F_RUSI_NEUTRAL = Нейтралитет
BE2_F_RUSI_NEUTRAL_EN = Neutrality
BE2_FD_RUSI_NEUTRAL = Страна объявляет себя вне блоков и не вмешивается в чужие конфликты, а иностранные войска уходят домой. Соседи успокаиваются, связи восстанавливаются, в казне появляются первые мирные доходы, а очки дипломатии растут.
BE2_FD_RUSI_NEUTRAL_EN = The country declares itself outside the blocs and does not intervene in other people's conflicts, and foreign troops go home. The neighbours calm down, ties are restored, the treasury gets its first peaceful income, and diplomacy points grow.

BE2_F_RUSI_OON = ООН и восточные соседи
BE2_F_RUSI_OON_EN = The United Nations and the Eastern Neighbours
BE2_FD_RUSI_OON = Делегация едет в Нью-Йорк, а соседние государства признают новые границы и переходят в общий совет. Страна получает очки дипломатии, договоры о дружбе и живую армию, которая пока не стреляет.
BE2_FD_RUSI_OON_EN = A delegation travels to New York, and the neighbouring states recognise the new borders and join the common council. The country gains diplomacy points, friendship treaties and a living army that does not shoot.

BE2_F_RUSI_SSSRIVAL = Соперничество с США
BE2_F_RUSI_SSSRIVAL_EN = Rivalry with the United States
BE2_FD_RUSI_SSSRIVAL = Страна берёт курс на полную самостоятельность: своя армия, своя программа вооружений, никаких уступок в спорных вопросах. Дипломатия и военная сила растут, но отношения с частью мира портятся.
BE2_FD_RUSI_SSSRIVAL_EN = The country takes a course of full independence: an army of its own, an armament programme of its own and no concessions on disputed questions. Diplomacy and military power grow, but relations with part of the world sour.

BE2_F_RUSI_VJETNAM = Вьетнам и третий мир
BE2_F_RUSI_VJETNAM_EN = Vietnam and the Third World
BE2_FD_RUSI_VJETNAM = Оружие, инструкторы и деньги уходят в Азию, где строятся новые государства. Страна покупает союзников и голоса в мировой политике, но война вдали от дома выматывает казну и армию.
BE2_FD_RUSI_VJETNAM_EN = Weapons, instructors and money go to Asia, where new states are being built. The country buys allies and votes in world politics, but a war far from home wears out the treasury and the army.

BE2_F_RUSI_RAZRJAD = Разряд или конфронтация
BE2_F_RUSI_RAZRJAD_EN = Détente or Confrontation
BE2_FD_RUSI_RAZRJAD = Прямые переговоры с западными державами и общий рынок для зерна, угля и машин, но если переговоры сорвутся, придётся вложить всё в пограничные рубежи. Страна получает дипломатию и деньги, а мир делится надвое.
BE2_FD_RUSI_RAZRJAD_EN = Direct negotiations with the western powers and a common market for grain, coal and machines, but if the talks fail everything will have to go into the border lines. The country gains diplomacy and money, and the world splits in two.

# ===================== РАСКОЛ =====================
BE2_F_RUSI_RASSKOL = Раскол федерации
BE2_F_RUSI_RASSKOL_EN = The Fracture of the Federation
BE2_FD_RUSI_RASSKOL = Западные республики отказываются подчиняться центру, южные поднимают оружие, единая страна рассыпается на части. Начинается гражданская война: власть прочнее, но половина федерации в руинах и народ разобщён.
BE2_FD_RUSI_RASSKOL_EN = The western republics refuse to obey the centre and the south takes up arms, and the united country falls apart. A civil war begins: the government is stronger, but half the federation lies in ruins and the people are split.
