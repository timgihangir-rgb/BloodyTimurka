# Новые страны, которые появляются в игре через гражданскую войну.
# Формат:  <тег> = <русский> | <English> | <українська>
# Скрипт tools/add_civ_names.py дописывает их в
# game/languages/civilizations/Bundle_ru.properties, Bundle.properties,
# Bundle_ua.properties. Идемпотентен: уже существующие ключи не трогает.
#
# Тег = реальный тег цивилизации + буква идеологии (см. game/Governments.json,
# поле Extra_Tag), поэтому getIdeologyID() в движке понимает их сам:
#   ger_n -> ConstuntionalMonarchy
#   rus_i -> PresidentialRepublic
ger_n = Германская монархия | German Monarchy | Німецька монархія
rus_i = Российская Федерация | Russian Federation | Російська Федерація

# страны, которые возникают при гражданской войне ВНУТРИ этих деревьев
eng_f = Фашистская Англия | Fascist England | Фашистська Англія
ger_q = Германская республика | German Republic | Німецька республіка
rus_q = Российская республика | Russian Republic | Російська республіка
pol_c = Польская Народная Республика | Polish People's Republic | Польська Народна Республіка
fra_b = Французская империя | French Empire | Французька імперія

# Югославия: демократическая республика после "Пакта с Берлином" (yugo_н ->
# yugo_d) и республики, откалывающиеся при "Развале Югославии".
yugo_d = Югославия | Yugoslavia | Югославія
cro_n = Хорватия | Croatia | Хорватія
slv_n = Словения | Slovenia | Словенія
mon_f = Черногория | Montenegro | Чорногорія
