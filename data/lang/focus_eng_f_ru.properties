BE2_FD_ENGF_AIRFORCE = Самолёты над каналами, по которым ещё вчера возили уголь. Армия перестаёт быть пехотой и начинает быть силой, у которой есть скорость.
BE2_FD_ENGF_AIRFORCE_EN = Aircraft over the canals that carried coal only yesterday. The army stops being infantry and becomes a force that has speed.
BE2_FD_ENGF_ATOM = Физики из бывших университетов обещают бомбу, которая сделает войну короткой. Денег не хватает сразу, и не хватит ещё долго.
BE2_FD_ENGF_ATOM_EN = Physicists from former universities promise a bomb that will make war short. The money is short at once, and will stay short for long.
BE2_FD_ENGF_AUTARKY = Юг решает, что ничего не покупает, а всё делает сам. Это дорого, неудобно и работает - с тех пор, как работает.
BE2_FD_ENGF_AUTARKY_EN = The south decides to buy nothing and make everything. It is expensive, awkward, and it works - as long as it works.
BE2_FD_ENGF_BROWNSHIRT = Отряды, которые охраняют собрания и разгоняют чужие, становятся силой, которую боятся больше, чем уважают. Страна начинает узнавать их манеру.
BE2_FD_ENGF_BROWNSHIRT_EN = Squads that guard meetings and break up rivals become a force feared more than respected. The country starts to recognise their manner.
BE2_FD_ENGF_CHARTER = Писаные правила: кто решает, кто подчиняется, что делать с теми, кто не согласен. Вместо кучки людей с оружием получается организация, которой можно управлять и которая переживёт вождя.
BE2_FD_ENGF_CHARTER_EN = Written rules: who decides, who obeys, what to do with those who disagree. Instead of armed men you get an organisation that can be run and will outlive its leader.
BE2_FD_ENGF_CHURCH = Колокола уходят под контроль, а приходы становятся местом, где очередь записывают заранее. Вера и расписание сливаются в один документ.
BE2_FD_ENGF_CHURCH_EN = Bells come under control and parishes become a place where the queue is booked in advance. Faith and timetable merge into one document.
BE2_FD_ENGF_CIVILSERVICE = Чиновников больше не назначают из Лондона, их берут на юге и учат заново. Новая страна перестаёт управляться изнутри чужой и начинает платить своим.
BE2_FD_ENGF_CIVILSERVICE_EN = Officials are no longer appointed from London; they are taken in the south and taught anew. The new country stops being run from inside another one and starts paying its own.
BE2_FD_ENGF_COAST = Кент, Сассекс и Девон переходят под управление южной столицы. Страна получает порты и подтверждение, что юг - это её середина, а не хвост.
BE2_FD_ENGF_COAST_EN = Kent, Sussex and Devon come under the southern capital. The country gets ports and the confirmation that the south is its middle, not its tail.
BE2_FD_ENGF_CONSCRIPT = Каждый мужчина страны получает номер и срок службы. Молодых становится меньше, а армия - настоящей, с резервистами и обученными офицерами.
BE2_FD_ENGF_CONSCRIPT_EN = Every man in the country gets a number and a term of service. There are fewer young men, and the army is real, with reserves and trained officers.
BE2_FD_ENGF_CORNWALL = Последний английский угол, который ещё смотрит на юг, присоединяют к новой стране. Каменные мысы закрывают южное крыло страны.
BE2_FD_ENGF_CORNWALL_EN = The last English corner that still looks south is joined to the new country. The stone headlands close the southern flank.
BE2_FD_ENGF_DEFENCE = Первый рубеж - от берега до Темзы - объявлен военной зоной и укреплён. Здесь новая страна начинается не с победы, а с того, что её не отдадут.
BE2_FD_ENGF_DEFENCE_EN = The first line, from the shore to the Thames, is declared a military zone and fortified. Here the new country does not begin with a victory but with not giving ground.
BE2_FD_ENGF_FOOD = Новый строй держится на сытом человеке: склады, пашни и резервы зерна должны пережить любую войну, которую юг сам же и начнёт.
BE2_FD_ENGF_FOOD_EN = The new order stands on a fed man: warehouses, fields and grain reserves must survive any war the south itself starts.
BE2_FD_ENGF_FOREIGN = Юг впервые говорит с соседями сам, а не через Лондон. Никто не признаёт его, но все хотят знать, чего он хочет.
BE2_FD_ENGF_FOREIGN_EN = The south speaks to its neighbours itself for the first time, not through London. Nobody recognises it, but everybody wants to know what it wants.
BE2_FD_ENGF_GESTAPO = Управление страной берут на себя те, кого никто не назначал и никто не уволит. Недовольных больше не слышно, и это принимают за порядок.
BE2_FD_ENGF_GESTAPO_EN = Running the country is taken over by those nobody appointed and nobody can dismiss. The dissatisfied are no longer heard, and that is taken for order.
BE2_FD_ENGF_INDUSTRY = Верфи и арматурные мастерские становятся военными. Меньше рабочих рук, но каждый завод делает то, что нужно армии, а не то, что продаётся.
BE2_FD_ENGF_INDUSTRY_EN = Dry docks and machine shops turn military. Fewer working hands, but every plant makes what the army needs rather than what sells.
BE2_FD_ENGF_ISLANDS = Мэн, Джерси и Оркней переходят под управление южной столицы. Остров наконец перестаёт быть страной, которую оскорбляют с другого острова.
BE2_FD_ENGF_ISLANDS_EN = The Isle of Man, Jersey and the Orkneys come under the southern capital. The island finally stops being a country insulted from another island.
BE2_FD_ENGF_LABOURFRONT = Страна перестаёт спрашивать, сколько стоит рабочая сила, и решает, что она стоит ровно столько, сколько нужно. Уголь, рельсы и хлеб идут по одному плану, и план этот не пересматривают.
BE2_FD_ENGF_LABOURFRONT_EN = The country stops asking what labour costs and decides it costs exactly what is needed. Coal, rails and bread follow one plan, and that plan is not reconsidered.
BE2_FD_ENGF_LONDON = Река Темза - последняя линия, за которой всё ещё белый флаг. Юг идёт на север, и столица страны меняется. Весь мир смотрит, кто победил.
BE2_FD_ENGF_LONDON_EN = The Thames is the last line behind which the white flag still flies. The south marches north and the capital changes. The whole world watches to see who won.
BE2_FD_ENGF_MILITIA = Шахтёры, рыбаки и портовые докеры вступают в строй с лопатой и винтовкой. Армии нет, но есть люди, которые умеют держать строй и ненавидят врага лично.
BE2_FD_ENGF_MILITIA_EN = Miners, fishermen and dockers fall in with a shovel and a rifle. There is no army, but there are men who can hold a line and hate the enemy in person.
BE2_FD_ENGF_MUSEUM = Из Лондона вывозят то, что нельзя оставить. Юг собирает своё: скелеты, пушки, карту юга и длинный зал, где всё стоит по своим причинам.
BE2_FD_ENGF_MUSEUM_EN = What cannot be left in London is taken away. The south collects its own: skeletons, cannons, a map of the south, and a long hall where everything stands for its own reasons.
BE2_FD_ENGF_NAVY = Клайдские доки и каналы, по которым ещё вчера везли уголь, становятся базой. Страна, у которой есть только суша, всегда проигрывает тем, у кого есть вода.
BE2_FD_ENGF_NAVY_EN = Clyde docks and the canals that carried coal only yesterday become a base. A country with only land always loses to those who have water.
BE2_FD_ENGF_ONEPARTY = Остальные партии закрываются, газеты переходят под контроль, выборы становятся формой. Страна получает внутренний мир и перестаёт слышать себя - зато любая задача теперь решается сразу.
BE2_FD_ENGF_ONEPARTY_EN = The other parties are closed, newspapers come under control, elections become a formality. The country gets internal peace and stops hearing itself - but now any task is solved at once.
BE2_FD_ENGF_PARLIAMENT = Из Лондона приезжают депутаты, которых никто не звал, но слушать их приходится: новый юг берёт себе имя старой страны и часть её парламентской формы. Ремонт дорог дороже, чем их уважение.
BE2_FD_ENGF_PARLIAMENT_EN = Deputies arrive from London uninvited, yet they must be listened to: the new south takes the name of the old country and part of its parliamentary form. Repairing roads costs more than their respect.
BE2_FD_ENGF_PARTY = Сотни ячеек сходятся в зале на юге: первый съезд выбирает вождя, принимает устав и объявляет мятеж не отменённым, а переходом к власти. Малому острову нужна настоящая партия, иначе это просто банда.
BE2_FD_ENGF_PARTY_EN = Hundreds of cells gather in a hall in the south: the first congress elects a leader, adopts a charter and declares the revolt not cancelled but begun. A small island needs a real party, or it is just a gang.
BE2_FD_ENGF_PRESS = Газеты перестают спорить между собой и начинают спорить с Лондоном. Тиражи растут, сдержанная пресса исчезает.
BE2_FD_ENGF_PRESS_EN = Newspapers stop arguing with each other and start arguing with London. Circulations grow, restrained press disappears.
BE2_FD_ENGF_PURGE = Из партии уходят те, кто сомневался вслух. Страна становится тише и управлять ей легче, но уйти теперь нельзя от слова "доктрина".
BE2_FD_ENGF_PURGE_EN = Those who doubted aloud leave the party. The country gets quieter and easier to rule, but no one can leave over the word "doctrine" now.
BE2_FD_ENGF_RACE = Страна решает, кто в ней свой, а кто нет, и записывает это в устав. Строительство идёт быстрее, а страна перестаёт быть домом для всех, кто здесь жил.
BE2_FD_ENGF_RACE_EN = The country decides who belongs and who does not, and writes it into the charter. Building goes faster, and the country stops being a home for all who lived here.
BE2_FD_ENGF_RADIO = Каждое утро голос из южных рупоров объясняет, что́ страна делает и почему это правильно. Даже те, кто не верит, узнают новости первыми.
BE2_FD_ENGF_RADIO_EN = Every morning a voice from southern speakers explains what the country is doing and why it is right. Even the unbelievers get the news first.
BE2_FD_ENGF_SCHOOL = Программа, гдеИстория начинается с мятежа, а география кончается границей. Через одно поколение страна будет другой, и она об этом не заметит.
BE2_FD_ENGF_SCHOOL_EN = A curriculum where history starts with the revolt and geography ends at the border. In a generation the country will be different and will not notice.
BE2_FD_ENGF_SCOTLAND = За Северным мостом страна становится островом по-настоящему. К этому моменту её форма правления не оставляет другого названия, чем то, что уже есть.
BE2_FD_ENGF_SCOTLAND_EN = Beyond the northern bridge the country becomes an island for real. By now its form of government leaves no other name than the one already used.
BE2_FD_ENGF_TANKS = Домашние верфи, железные дороги и угольные шахты дают первые машины. Юг упирается в рельсы и в чужую границу, и решает проблему бронёй.
BE2_FD_ENGF_TANKS_EN = Dry docks, railways and coal mines give the first machines. The south is stuck against rails and a foreign border, and solves it with armour.
BE2_FD_ENGF_TELEVISION = Картинку можно не пустить, а голос ещё можно заглушить. Страна получает глаз, который смотрит в каждый дом, и дом, в который смотрят все.
BE2_FD_ENGF_TELEVISION_EN = A picture can be cut off, a voice can still be jammed. The country gets an eye that looks into every home, and a home that is looked into by all.
BE2_FD_ENGF_UNIFORM = Одинаковая одежда, одинаковый знак, одинаковая команда. Милиция перестаёт быть сбродом добровольцев и становится войском.
BE2_FD_ENGF_UNIFORM_EN = Same clothes, same badge, same orders. The militia stops being a mob of volunteers and becomes an army.
BE2_FD_ENGF_WALES = Угольные долины решают вопрос с ресурсами. Уэльс присоединяется не побеждённый, а купленный, и этой сделке ещё предстоит расплатиться.
BE2_FD_ENGF_WALES_EN = The coal valleys settle the question of resources. Wales is joined not beaten but bought, and that bill is yet to come due.
BE2_FD_ENGF_WHEELS = Лондонские заказы приходят сюда уже не как указ, а как заказ. Рельсы, станки и мосты сращивают юг в одну страну, а не в набор портов.
BE2_FD_ENGF_WHEELS_EN = London orders now arrive not as decree but as purchase order. Rails, machines and bridges weld the south into one country, not a set of ports.
