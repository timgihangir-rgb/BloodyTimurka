BE2_F_POLC_PANSTWO = Государство без границ
BE2_F_POLC_PANSTWO_EN = A State Without Borders
BE2_F_POLC_PARTIA = Партия
BE2_F_POLC_PARTIA_EN = The Party
BE2_F_POLC_PIECIOLATKA = Пятилетка
BE2_F_POLC_PIECIOLATKA_EN = The Five-Year Plan
BE2_F_POLC_PLANOWANIE = Планирование
BE2_F_POLC_PLANOWANIE_EN = Planning
BE2_F_POLC_POMORZE = Поморье
BE2_F_POLC_POMORZE_EN = Pomerania
BE2_F_POLC_PRZEMYSL = Тяжёлая промышленность
BE2_F_POLC_PRZEMYSL_EN = Heavy Industry
BE2_F_POLC_RADIO = Радио
BE2_F_POLC_RADIO_EN = Radio
BE2_F_POLC_SIEC = Железные дороги сети
BE2_F_POLC_SIEC_EN = The Network of Rails
BE2_F_POLC_SOWIETY = Советы на местах
BE2_F_POLC_SOWIETY_EN = Local Soviets
BE2_F_POLC_SZKOLA = Народное просвещение
BE2_F_POLC_SZKOLA_EN = Public Education
BE2_F_POLC_UPRZEMYSLENIE = Упразднение мелкой промышленности
BE2_F_POLC_UPRZEMYSLENIE_EN = Abolishing Small Industry
BE2_F_POLC_WIELKOPOLSKA = Великопольша
BE2_F_POLC_WIELKOPOLSKA_EN = Wielkopolska
BE2_F_POLC_WOJSKO = Страна на военном положении
BE2_F_POLC_WOJSKO_EN = The Country on War Footing
BE2_F_POLC_WYBRZEZE = Выжнег
BE2_F_POLC_WYBRZEZE_EN = The Coastline

BE2_FD_POLC_BRONI = Страна, у которой есть уголь и железо, делает оружие вместо того, чтобы покупать. Заводы стоят у Силезии, и война приходит к ним сама.
BE2_FD_POLC_BRONI_EN = A country with coal and iron makes weapons instead of buying them. The plants stand near Silesia, and war comes to them by itself.
BE2_FD_POLC_EKSPORT = Валюта приходит извне, и страна привыкает к мысли, что её благополучие зависит от чужой покупательной способности.
BE2_FD_POLC_EKSPORT_EN = Currency arrives from outside, and the country gets used to the thought that its wealth depends on someone else’s ability to buy.
BE2_FD_POLC_FRONTOVOY = У армии есть национальная идея, и это дешевле любого генерала. Она появляется у шахт, где люди уже умеют держать строй.
BE2_FD_POLC_FRONTOVOY_EN = The army has a national idea, which is cheaper than any general. It appears at the mines, where people already know how to stand in line.
BE2_FD_POLC_GDANSK = Свободный город сдаётся не добровольно: договор подписывают под угрозой блокады, и обе стороны делают вид, что это была встреча.
BE2_FD_POLC_GDANSK_EN = The free city does not surrender voluntarily: the treaty is signed under threat of a blockade, and both sides act as if it had been a meeting.
BE2_FD_POLC_IDEOLOGIA = Страна решает, что́ думать, и записывает это в учебник. Учебник меняется, страна - нет.
BE2_FD_POLC_IDEOLOGIA_EN = The country decides what to think and writes it into the textbook. The textbook changes, the country does not.
BE2_FD_POLC_KONGRES = Съезд решает всё, включая то, что решать не должен. Страна получает быстрое управление и отсутствие апелляции.
BE2_FD_POLC_KONGRES_EN = The congress decides everything, including what it should not decide. The country gets fast rule and no appeal.
BE2_FD_POLC_KULTURA = Театры и газеты, которые можно критиковать заранее, до того как придут за критиком. Это дешёвый способ сохранить разговор.
BE2_FD_POLC_KULTURA_EN = Theatres and papers that can be criticised in advance, before anyone comes for the critic. It is a cheap way to keep a conversation going.
BE2_FD_POLC_LOTNICTWO = Страна строит самолёты, потому что её граница - это воздух, а не камень. Пилотов набирают из тех, кто чинит тракторы.
BE2_FD_POLC_LOTNICTWO_EN = The country builds aircraft because its border is air, not stone. Pilots are recruited from those who repair tractors.
BE2_FD_POLC_MILICJA = Шахтёры и портовые рабочие получают винтовку вместе с зарплатой. Они воюют лучше армии, потому что воюют за свой дом.
BE2_FD_POLC_MILICJA_EN = Miners and dockers get a rifle together with a wage. They fight better than an army because they fight for their own home.
BE2_FD_POLC_NAUKA = Институты, где считают вслух и записывают результат. Страна начинает понимать, что она сама мешает своей промышленности.
BE2_FD_POLC_NAUKA_EN = Institutes that count out loud and write down the result. The country begins to see that it is itself in the way of its own industry.
BE2_FD_POLC_NOWA_HUTA = Новый металлургический завод строят рядом с углём, а не рядом с рынком. Так в стране появляется город, которого ещё нет на картах соседей.
BE2_FD_POLC_NOWA_HUTA_EN = The new steelworks is built next to the coal, not next to the market. So a city appears that is not yet on the neighbours’ maps.
BE2_FD_POLC_PANSTWO = Страна, начавшаяся в трёх городах, провозглашает себя тем, чем была раньше, - и с этого момента её существование приходится оправдывать.
BE2_FD_POLC_PANSTWO_EN = The country, which began in three cities, declares itself what it once was - and from that moment has to justify its own existence.
BE2_FD_POLC_PARTIA = Страна начинается не с государства, а с партии, которая уверена, что государство ей подчиняется. Обычно выходит наоборот.
BE2_FD_POLC_PARTIA_EN = The country begins not with a state but with a party that assumes the state obeys it. Usually it is the other way round.
BE2_FD_POLC_PIECIOLATKA = План, у которого есть срок и цифры. Страна строит много и не то, и через пять лет либо берёт план выше, либо берёт чужой.
BE2_FD_POLC_PIECIOLATKA_EN = A plan with a deadline and numbers. The country builds a lot of the wrong things, and in five years either raises the plan or takes someone else’s.
BE2_FD_POLC_PLANOWANIE = Страна решает, сколько угля будет добыто в 1953 году, и под это выдаёт всё остальное. План спасает страну и заканчивается вместе с ней.
BE2_FD_POLC_PLANOWANIE_EN = The country decides how much coal will be mined in 1953 and gives everything else to match. The plan saves the country and ends with it.
BE2_FD_POLC_POMORZE = Земли вдоль воды присоединяются вместе с портами, и страна получает второй выход в море - уже свой, а не арендованный.
BE2_FD_POLC_POMORZE_EN = The lands along the water join with their ports, and the country gets a second way to the sea - its own, not rented.
BE2_FD_POLC_PRZEMYSL = Страна делает то, что неудобно везти, но выгодно продавать. Рынок соседей узнаёт её продукцию раньше, чем её флаг.
BE2_FD_POLC_PRZEMYSL_EN = The country makes what is awkward to ship but good to sell. Neighbours’ markets learn its goods before they learn its flag.
BE2_FD_POLC_RADIO = Страна говорит сразу со всеми и не слышит никого. Это решает половину внутренней политики и создаёт другую.
BE2_FD_POLC_RADIO_EN = The country talks to everyone at once and hears no one. This settles half the domestic policy and creates the other half.
BE2_FD_POLC_SIEC = Страна связывает уголь, руду и порт в одну схему, и в этой схеме всё зависит от того, будет ли зима мягкой.
BE2_FD_POLC_SIEC_EN = The country links coal, ore and port into one scheme, and in that scheme everything depends on whether the winter is mild.
BE2_FD_POLC_SOWIETY = Власть переносится туда, где её видно. Страна решает быстрее и ошибается ближе к земле, а значит - дешевле.
BE2_FD_POLC_SOWIETY_EN = Power moves where it can be seen. The country decides faster and errs closer to the ground, which means cheaper.
BE2_FD_POLC_SZKOLA = Школа учит читать, писать и считать - и это делает страну грамотной раньше, чем богатой.
BE2_FD_POLC_SZKOLA_EN = The school teaches reading, writing and counting - and that makes the country literate before it makes it rich.
BE2_FD_POLC_UPRZEMYSLENIE = Мелкие мастерские закрывают, а их людей переводят в большие цеха. Страна производит больше и ненавидит себя чуть больше.
BE2_FD_POLC_UPRZEMYSLENIE_EN = Small workshops are closed and their people moved to large shops. The country produces more and dislikes itself slightly more.
BE2_FD_POLC_WIELKOPOLSKA = Земли, которые меняли хозяев четыре раза за сто лет, меняют хозяев в пятый. На этот раз - навсегда, уверяет страна.
BE2_FD_POLC_WIELKOPOLSKA_EN = Lands that changed hands four times in a century change hands a fifth. This time for good, the country assures itself.
BE2_FD_POLC_WOJSKO = Вся экономика становится военной. Страна выигрывает быстро и всё реже.
BE2_FD_POLC_WOJSKO_EN = The whole economy becomes military. The country wins quickly and ever more rarely.
BE2_FD_POLC_WYBRZEZE = Страна с портом и границей по воде. Всё, что было неясно в её начале, становится ясным у воды.
BE2_FD_POLC_WYBRZEZE_EN = A country with a port and a border on water. Whatever was unclear at its beginning becomes clear at the water.
