# Переводы новых фокусов Польши (35 фокусов).
# Дерева фокусов у Польши раньше не было, поэтому здесь все четыре ключа
# на каждый фокус. Вливается в game/languages/focus/Bundle_ru.properties
# скриптом tools/merge_props.py.

# ===================== ПРОМЫШЛЕННОСТЬ И НАУКА =====================
BE2_F_POL_PLAN5 = Четвёртая программа
BE2_F_POL_PLAN5_EN = The Fourth Programme
BE2_FD_POL_PLAN5 = С 1936 года начинается новая четырёхлетка: сельское хозяйство, уголь и новые заводы берутся за дело одновременно. Производство и рост хозяйства ускоряются, но казна платит за это налогами и напряжением в стране.
BE2_FD_POL_PLAN5_EN = A new four-year plan starts in 1936: farming, coal and new plants are tackled all at once. Production and economic growth speed up, but the treasury pays for it with taxes and tension in the country.

BE2_F_POL_CIPO = Центральный промышленный округ
BE2_F_POL_CIPO_EN = The Central Industrial District
BE2_FD_POL_CIPO = Верхняя Силезия и Мазовица получают единый промышленный округ: уголь, сталь и машиностроение переходят под одно управление. Управление страной становится плотнее, а в казну идут налоги с новых заводов.
BE2_FD_POL_CIPO_EN = Upper Silesia and Mazovia get a single industrial district: coal, steel and engineering come under one management. Administration tightens, and the treasury gets taxes from the new plants.

BE2_F_POL_UGOL = Уголь и сталь
BE2_F_POL_UGOL_EN = Coal and Steel
BE2_FD_POL_UGOL = Каменноугольный бассейн и сталелитейные заводы верхней Силезии работают на полную: страна получает уголь и металл, которых ей не хватало. Армия крепнет, а производство перестаёт зависеть от ввоза.
BE2_FD_POL_UGOL_EN = The coal basin and the steel mills of Upper Silesia run at full capacity: the country gets the coal and metal it lacked. The army grows stronger, and production stops depending on imports.

BE2_F_POL_FABRYKA = Завод Фабрика
BE2_F_POL_FABRYKA_EN = The Fabryka Plant
BE2_FD_POL_FABRYKA = Государственный автомобильный завод в столице спускает с конвейера первые машины для своего рынка. Завод даёт армии технику и десятки тысяч рабочих мест, но требует вложений, которых у казны нет.
BE2_FD_POL_FABRYKA_EN = The state car plant in the capital rolls the first cars for the home market. It gives the army vehicles and tens of thousands of jobs, but it demands investment the treasury does not have.

BE2_F_POL_POLSFORD = Завод Польски-Форд
BE2_F_POL_POLSFORD_EN = The Polski-Ford Plant
BE2_FD_POL_POLSFORD = Совместное предприятие с американским капиталом ставит на конвейер лёгкие автомобили и армейские грузовики. Очки передвижения войск растут, в казну идут налоги с продаж, а в страну приходит новая техника.
BE2_FD_POL_POLSFORD_EN = A joint venture with American capital puts light cars and army trucks on the assembly line. Troop movement points grow, sales taxes flow into the treasury, and new technology arrives from abroad.

BE2_F_POL_NAUKA = Наука и техника
BE2_F_POL_NAUKA_EN = Science and Technology
BE2_FD_POL_NAUKA = Институты, университеты и лаборатории получают деньги и защиту государства, а исследовательская работа впервые становится делом всей страны. Исследования идут заметно быстрее, а управление научными деньгами становится плотнее.
BE2_FD_POL_NAUKA_EN = Institutes, universities and laboratories get state money and state protection, and research becomes a matter of the whole country for the first time. Research moves faster, and research money is administered more tightly.

BE2_F_POL_ATOM = Атомный проект
BE2_F_POL_ATOM_EN = The Atomic Project
BE2_FD_POL_ATOM = Поздняя и скромная попытка собрать собственную атомную бомбу: расходы колоссальны, а срок сдвигается всё дальше. Наука получает мощный толчок, но казна надолго остаётся в долгах, а бомба получается позже и слабее.
BE2_FD_POL_ATOM_EN = A late and modest attempt to build a bomb of our own: the cost is enormous and the deadline keeps slipping. Research gets a strong push, but the treasury stays in debt for a long time, and the bomb arrives late and weak.

# ===================== АРМИЯ =====================
BE2_F_POL_ARMY5 = Армия на пять миллионов
BE2_F_POL_ARMY5_EN = An Army of Five Million
BE2_FD_POL_ARMY5 = Санация ставит армии задачу: пять миллионов человек под знаменем к сороковому году. Мобильный резерв и военные очки растут, но содержать такую массу пехоты дорого, и страна это чувствует.
BE2_FD_POL_ARMY5_EN = The Sanacja government gives the army a task: five million men under the flag by the fortieth year. Manpower and military points grow, but keeping that mass of infantry fed is expensive, and the country feels it.

BE2_F_POL_MOBPLAN = Мобилизационный план
BE2_F_POL_MOBPLAN_EN = The Mobilisation Plan
BE2_FD_POL_MOBPLAN = Готовые списки, склады, железные дороги и шины переводят страну на мобилизационную ногу за считанные дни. Призывной ресурс общества растёт, а содержание армии ложится тяжёлым бременем на казну.
BE2_FD_POL_MOBPLAN_EN = Ready lists, depots, railways and tyres put the country on a war footing within days. The recruitable population grows, while army upkeep weighs heavily on the treasury.

BE2_F_POL_PECHOTA = Реформа пехоты
BE2_F_POL_PECHOTA_EN = Reform of the Infantry
BE2_FD_POL_PECHOTA = Солдаты получают единое оружие, обучение в лагерях и строй. Наступление и оборона становятся организованнее, а численность армии увеличивается на целый корпус новобранцев.
BE2_FD_POL_PECHOTA_EN = Soldiers get standard weapons, camp training and a proper line. Assault and defence become better organised, and the army grows by a whole corps of recruits.

BE2_F_POL_KAWALERIA = Кавалерия
BE2_F_POL_KAWALERIA_EN = The Cavalry
BE2_FD_POL_KAWALERIA = Кавалерийские бригады, проверенные в пограничных схватках, становятся полноценной ударной силой армии. Войска двигаются быстрее и бьют глубже, но содержание конного строя съедает деньги казны.
BE2_FD_POL_KAWALERIA_EN = Cavalry brigades, tried out in border skirmishes, become a real striking force. Troops move faster and strike deeper, but keeping a mounted arm eats the treasury's money.

BE2_F_POL_TANKI = Танки и броня
BE2_F_POL_TANKI_EN = Tanks and Armour
BE2_FD_POL_TANKI = Собственные танки и первые танковые бригады: поле боя перестаёт принадлежать одной пехоте. Атака и оборона растут одновременно, зато на технику уходит весь свободный капитал страны.
BE2_FD_POL_TANKI_EN = Tanks of our own and the first tank brigades: the battlefield stops belonging to infantry alone. Attack and defence both grow, but all the spare capital of the country goes into hardware.

BE2_F_POL_LOTNICTWO = Военно-воздушные силы
BE2_F_POL_LOTNICTWO_EN = The Air Force
BE2_FD_POL_LOTNICTWO = Авиационный завод и школьные аэродромы дают армии собственные самолёты и своих пилотов. Удар с воздуха становится отдельным родом войск, а молодые лётчики — силой, которой у страны раньше просто не было.
BE2_FD_POL_LOTNICTWO_EN = An aircraft plant and flying-school airfields give the army aircraft of its own and pilots of its own. Air strike becomes a separate arm, and young flyers become a force the country simply did not have before.

BE2_F_POL_MORSKIFLOT = Морской флот
BE2_F_POL_MORSKIFLOT_EN = The Navy
BE2_FD_POL_MORSKIFLOT = Порты Балтики обрастают кораблями, доками и мастерскими. Флот прикрывает побережье и устье Вислы, оборона страны крепнет, а содержание эскадры становится самой дорогой статьёй бюджета.
BE2_FD_POL_MORSKIFLOT_EN = The Baltic ports fill with ships, docks and workshops. The fleet covers the coast and the mouth of the river, the country's defence grows, and the squadrons become the most expensive item in the budget.

# ===================== ГРАНИЦА И БЕЗОПАСНОСТЬ =====================
BE2_F_POL_WSCHOD = Продвижение на восток
BE2_F_POL_WSCHOD_EN = Advance to the East
BE2_FD_POL_WSCHOD = Восточные уезсы и приграничная полоса объявляются зоной особого порядка, где командуют военные. Дипломатические и военные очки растут, но хозяйство и крестьянство там платят за это сползанием.
BE2_FD_POL_WSCHOD_EN = The eastern counties and the border strip are declared a special zone under military command. Diplomacy and military points grow, but farming and the peasantry there pay for it with decline.

BE2_F_POL_UTR = Полоса приграничных укреплений
BE2_F_POL_UTR_EN = The Border Fortification Belt
BE2_FD_POL_UTR = От Вислы до Познани тянутся бетонные укрепления, противотанковые рвы и заминированные поля. Прорваться на запад почти невозможно, и на эти укрепления уходит заметная часть военного бюджета.
BE2_FD_POL_UTR_EN = Concrete fortifications, anti-tank ditches and minefields run from the river to the western frontier. Breaking through to the west is almost impossible, and a large part of the military budget goes into them.

BE2_F_POL_KORIDOR = Польский коридор
BE2_F_POL_KORIDOR_EN = The Polish Corridor
BE2_FD_POL_KORIDOR = Коридор к морю и соседние земли переходят под полный контроль страны: тысячи жителей и гарнизоны переходят под власть Варшавы. Население и мобильный резерв растут, а соседи читают это как открытую угрозу.
BE2_FD_POL_KORIDOR_EN = The corridor to the sea and the lands around it come under the full control of the country: thousands of people and garrisons pass under the capital's rule. Population and manpower grow, and the neighbours read it as an open threat.

BE2_F_POL_DVAFRONTA = План войны на два фронта
BE2_F_POL_DVAFRONTA_EN = The Two-Front War Plan
BE2_FD_POL_DVAFRONTA = Штаб строит план мобилизации одновременно на западе и на востоке и делит войска между двумя направлениями. Дипломатия и армия становятся сильнее, но держать такую армию можно только общим призывом.
BE2_FD_POL_DVAFRONTA_EN = The staff builds a mobilisation plan for the west and the east at once and splits the army between the two directions. Diplomacy and the army grow stronger, but such an army can only be kept on a single general levy.

BE2_F_POL_INTEL = Разведка
BE2_F_POL_INTEL_EN = Intelligence
BE2_FD_POL_INTEL = Сеть информаторов и агентов за рубежом перестраивается под новые границы и новых соседей. Дипломатические очки и управление страной растут, а знание чужих планов обходится в нервы и в деньги.
BE2_FD_POL_INTEL_EN = The network of informants and agents abroad is rebuilt for the new borders and the new neighbours. Diplomacy points and administration grow, while knowing other people's plans costs nerves and money.

BE2_F_POL_TAJNA = Тайная полиция
BE2_F_POL_TAJNA_EN = The Secret Police
BE2_FD_POL_TAJNA = Тайная полиция и внутренняя охрана берут в свои руки все внутренние дела государства и следят за границей. Управление страной заметно улучшается, а довольство общества падает вместе с уровнем жизни.
BE2_FD_POL_TAJNA_EN = The secret police and the internal guard take over every internal affair of the state and watch the border. Administration improves markedly, while the contentment of society falls together with the standard of living.

# ===================== ПОЛИТИКА =====================
BE2_F_POL_SANACJA = Укрепление санации
BE2_F_POL_SANACJA_EN = Consolidation of the Sanacja
BE2_FD_POL_SANACJA = Санация собирает всю полноту власти в одних руках: президент, правящий лагерь и командование армией подчинены одной воле. Прочность режима растёт, а народное довольство падает: страна живёт тревожнее прежнего.
BE2_FD_POL_SANACJA_EN = The Sanacja gathers all power in one pair of hands: the president, the ruling camp and the army command obey a single will. The regime grows more stable, but popular contentment falls: the country lives more tensely than before.

BE2_F_POL_RYWAL = Разрыв с бросаками
BE2_F_POL_RYWAL_EN = Break with the Exiles
BE2_FD_POL_RYWAL = Старые эмигрантские круги и бывшие правительства за границей публично отвергаются и объявляются врагами. Мир смотрит на страну теплее, дипломатия и доходы растут, а соседи замечают перемену.
BE2_FD_POL_RYWAL_EN = The old émigré circles and the former governments abroad are publicly rejected and declared enemies. The world looks at the country more warmly, diplomacy and income grow, and the neighbours notice the change.

BE2_F_POL_DEMOKRAT = Демократизация
BE2_F_POL_DEMOKRAT_EN = Democratisation
BE2_FD_POL_DEMOKRAT = Улицы, выборы и свободная пресса приходят на смену тайным указам: страна становится парламентской республикой. Народное довольство взлетает, прочность режима растёт, а зарубежные дипломаты видят в стране равного партнёра.
BE2_FD_POL_DEMOKRAT_EN = Streets, elections and a free press replace secret decrees: the country becomes a parliamentary republic. Popular contentment soars, the regime grows more stable, and foreign diplomats see an equal partner.

BE2_F_POL_PARLAMENT = Парламентское правительство
BE2_F_POL_PARLAMENT_EN = Parliamentary Government
BE2_FD_POL_PARLAMENT = Власть переходит к парламенту, а правительство отвечает перед ним за каждый шаг и за каждый рубль. Управление страной становится плотнее, но решения принимаются медленнее и осторожнее.
BE2_FD_POL_PARLAMENT_EN = Power passes to parliament, and the government answers to it for every step and every coin. Administration of the country tightens, but decisions are made more slowly and more carefully.

BE2_F_POL_CHLOP = Союз с крестьянством
BE2_F_POL_CHLOP_EN = Alliance with the Peasantry
BE2_FD_POL_CHLOP = Крестьянский союз получает землю, сбыт по твёрдой цене и собственные органы власти на местах. Еды в стране заметно больше, население растёт, а крестьяне перестают считать власть чужим делом.
BE2_FD_POL_CHLOP_EN = The peasants' union gets land, a fixed purchase price and its own local authorities. There is clearly more food in the country, the population grows, and the peasants stop treating the government as someone else's business.

BE2_F_POL_NACJON = Национализация
BE2_F_POL_NACJON_EN = Nationalisation
BE2_FD_POL_NACJON = Крупные заводы, банки и помещичьи земли переходят в собственность государства и управляются из столицы. Производство и налоговые поступления растут, но за это платит город, и недовольство поднимается всё выше.
BE2_FD_POL_NACJON_EN = Large plants, banks and landed estates pass into state ownership and are run from the capital. Production and tax income grow, but the towns pay for it, and discontent rises ever higher.

BE2_F_POL_NARDEM = Народная демократия
BE2_F_POL_NARDEM_EN = People's Democracy
BE2_FD_POL_NARDEM = Господствующая партия и профсоюзы берут власть в свои руки и объявляют народные Советы единственной силой. Страна становится союзом пролетариата: призывной ресурс растёт, а довольство народа падает вместе со свободой.
BE2_FD_POL_NARDEM_EN = The ruling party and the trade unions take power into their own hands and declare the people's councils the only force. The country becomes a union of the proletariat: the recruitable population grows, while the contentment of the people falls together with freedom.

# ===================== ВНЕШНЯЯ ПОЛИТИКА =====================
BE2_F_POL_ZACHOD = Договор с Западом
BE2_F_POL_ZACHOD_EN = The Western Pact
BE2_FD_POL_ZACHOD = Перемирие на континенте держится, и страна оформляет себя как опора западного мира. Отношения со всеми странами теплеют, иностранные кредиты и деньги поступают в казну, а пограничные ссоры временно стихают.
BE2_FD_POL_ZACHOD_EN = The truce on the continent holds, and the country presents itself as a pillar of the western world. Relations with every country warm up, foreign credits and money flow into the treasury, and border quarrels die down for a while.

BE2_F_POL_FRANCE = Пакт с Францией
BE2_F_POL_FRANCE_EN = The Pact with France
BE2_FD_POL_FRANCE = С Парижем подписан пакт о помощи и о нерушимости западной границы. Страна получает доступ к французским деньгам и заводам, отношения с соседями становятся прочнее, а страна перестаёт быть одинокой.
BE2_FD_POL_FRANCE_EN = A pact of assistance and of the inviolability of the western border is signed with Paris. The country gains access to French money and French plants, relations with its neighbours grow firmer, and the country stops being alone.

BE2_F_POL_DANZIG = Марш на Данциг
BE2_F_POL_DANZIG_EN = The March on Danzig
BE2_FD_POL_DANZIG = Город у залива и коридор к морю заявляют о готовности вернуться в состав страны. Дипломатические очки и армия растут, но весь мир читает это как открытый вызов и как начало войны.
BE2_FD_POL_DANZIG_EN = The city on the bay and the corridor to the sea declare themselves ready to return to the country. Diplomacy points and the army grow, but the whole world reads it as an open challenge and as the start of a war.

BE2_F_POL_PAKT = Договор с СССР о ненападении
BE2_F_POL_PAKT_EN = The Non-Aggression Pact
BE2_FD_POL_PAKT = Вместо союза идёт только договор о ненападении: страна берёт понемногу у обеих сторон и держится в стороне. Мобильный резерв и армия получают время и запас, а отношения со всеми остаются осторожными.
BE2_FD_POL_PAKT_EN = Instead of an alliance there is only a non-aggression pact: the country takes a little from both sides and stays out of it. Manpower and the army gain time and a reserve, while relations with everyone stay careful.

BE2_F_POL_LONDON = Правительство в изгнании
BE2_F_POL_LONDON_EN = The Government in Exile
BE2_FD_POL_LONDON = Армия и правительство уходят за границу и продолжают войну из чужой столицы. Дипломатические очки и прочность режима растут, но страна на родине остаётся без правительства и живёт в подполье.
BE2_FD_POL_LONDON_EN = The army and the government go abroad and continue the war from a foreign capital. Diplomacy points and the stability of the regime grow, but the country at home is left without a government and lives underground.

BE2_F_POL_OPOR = Сопротивление
BE2_F_POL_OPOR_EN = The Resistance
BE2_FD_POL_OPOR = Подпольная армия и тайное государство переходят от связи к действию: диверсии, взрывы в тылу, связь с изгнанием. Призывной ресурс общества втайне мобилизуется, а удары и урон войскам противника растут.
BE2_FD_POL_OPOR_EN = The underground army and the secret state move from contact to action: sabotage, explosions in the rear, links with the exile. The recruitable population is mobilised in secret, and strikes and damage to enemy troops grow.

BE2_F_POL_OSLOB = Освобождение страны
BE2_F_POL_OSLOB_EN = Liberation of the Country
BE2_FD_POL_OSLOB = Освободительные войска вступают в освобождённые земли и наводят порядок, а страна получает прежние границы и прежнее население. Устойчивость власти крепнет, очки армии возвращаются, а страна перестаёт быть изгнанником.
BE2_FD_POL_OSLOB_EN = The liberating armies enter the freed lands and restore order, and the country gets its old borders and its old population back. Stability grows, military points return, and the country stops being an exile.

# ===================== ГРАЖДАНСКАЯ ВОЙНА =====================
BE2_F_POL_CIVILWAR = Крестьянская революция
BE2_F_POL_CIVILWAR_EN = The Peasant Revolution
BE2_FD_POL_CIVILWAR = Партия и армия требуют власти для себя, и страна раскалывается надвое прямо в своих границах. Прочность режима рушится, довольство народа падает до дна, а применяется самая грубая сила.
BE2_FD_POL_CIVILWAR_EN = The party and the army demand power for themselves, and the country splits in two inside its own borders. The stability of the regime collapses, the contentment of the people falls to the bottom, and the bluntest force is used.
