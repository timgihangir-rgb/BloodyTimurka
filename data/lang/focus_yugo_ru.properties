BE2_F_YUGO_PETNOL = Нефть и уголь
BE2_F_YUGO_PETNOL_EN = Oil and Coal
BE2_F_YUGO_PLAN5 = Пятилетний план
BE2_F_YUGO_PLAN5_EN = The Five-Year Plan
BE2_F_YUGO_POLOPRIM = Хлеб и земля
