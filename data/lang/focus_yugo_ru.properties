BE2_F_YUGO_ZAPAD = Договор с западом
BE2_F_YUGO_ZAPAD_EN = The Western Agreement
BE2_F_YUGO_ZELEZNICA = Сеть дорог
BE2_F_YUGO_ZELEZNICA_EN = The Railway Net
BE2_F_YUGO_ZVEZDA = Звезда над Балканами
BE2_F_YUGO_ZVEZDA_EN = A Star Over the Balkans

BE2_FD_YUGO_ALBANIA = Тирану занимают без долгих переговоров. Албанскую границу переносят, страну переписывают в союзную провинцию, и школьники в Приштине учат, что море начинается прямо от их порога.
BE2_FD_YUGO_ALBANIA_EN = Tirana is taken without long negotiations. The Albanian border is moved, the country is re-written as a federal province, and school children in Pristina learn that the sea begins right at their doorstep.
BE2_FD_YUGO_AVIACIJA = Под Белградом открывают первый союзный аэродром, и страна получает то, чего у неё не было ни одного дня: собственную авиацию.
BE2_FD_YUGO_AVIACIJA_EN = The first federal airfield opens near Belgrade, and the country gets the thing it never had for a single day: an air force of its own.
BE2_FD_YUGO_BALKAN = Белград сажает соседей за стол и предлагает всем одну и ту же границу. Страны Балкан соглашаются на словах и не соглашаются на карте.
BE2_FD_YUGO_BALKAN_EN = Belgrade seats its neighbours at one table and offers them all the same border. The Balkan states agree in words and do not agree on the map.
BE2_FD_YUGO_BRONI = Пушечные заводы в Нише и Крагуевце переходят на союзный заказ. Война, если случится, будет вооружена не чужими поставками, а собственными стволами.
BE2_FD_YUGO_BRONI_EN = The gun plants at Nis and Kragujevac take federal orders. The war, if it comes, will be armed by its own barrels rather than by foreign deliveries.
BE2_FD_YUGO_BRZDL = Броневой лист в Нише и Ужице идёт на танки, а не на тракторы для сельских работ. Завод переводят на военный заказ, и крестьяне жалуются, что тракторы больше не делают.
BE2_FD_YUGO_BRZDL_EN = The armour plate at Nis and Uzice goes into tanks instead of farm tractors. The works is switched to war orders, and the peasants complain that no more tractors are made.
BE2_FD_YUGO_ELEKTRO = Запруды на Дрине и в Далмации светят половине страны. Ток течёт по линиям, которые тянули через три границы, потому что одну станцию построить дешевле, чем три.
BE2_FD_YUGO_ELEKTRO_EN = The dams on the Drina and in Dalmatia light half the country. The current runs along lines that crossed three borders, because one station is cheaper to build than three.
BE2_FD_YUGO_FLOTA = Два республиканских флота срастаются в один. Средиземноморье перестаёт быть чужим берегом.
BE2_FD_YUGO_FLOTA_EN = The two republic fleets grow into one. The Mediterranean stops being someone else's shore.
BE2_FD_YUGO_GORA = Горы, в которых живут сербы, албанцы и хорваты, объявляют стратегической линией. Солдаты сюда не проходят, и в этом смысле горы надёжнее конституции.
BE2_FD_YUGO_GORA_EN = The mountains where Serbs, Albanians and Croats live are declared a strategic line. Soldiers do not come through here, and in that sense the mountains are more reliable than the constitution.
BE2_FD_YUGO_GRAD = Столица перестаёт помещаться в старых кварталах. На берегу Савы кладут первый камень, и город для всей страны становится доказательством, что федерация не сон.
BE2_FD_YUGO_GRAD_EN = The capital no longer fits in the old quarters. The first stone is laid on the bank of the Sava, and for the whole country the city becomes proof that the federation is not a dream.
BE2_FD_YUGO_JEDINSTVO = Словенцы, хорваты, сербы, черногорцы, македонцы, боснийцы и косовары живут в одном государстве и почти не понимают друг друга. Устав союзного собрания написан так, чтобы ни одна республика не почувствовала себя старшей.
BE2_FD_YUGO_JEDINSTVO_EN = Slovenes, Croats, Serbs, Montenegrins, Macedonians, Bosnians and Kosovars live in one state and barely understand each other. The statute of the federal assembly is written so that no republic feels itself the elder.
BE2_FD_YUGO_KONSTITUTSIYA = Устав дописывают до конституции. Первая статья гласит, что Югославия - союзное государство, и эта статья дороже всех остальных вместе взятых.
BE2_FD_YUGO_KONSTITUTSIYA_EN = The statute is finished off into a constitution. The first article says that Yugoslavia is a federal state, and that article costs more than all the others put together.
BE2_FD_YUGO_NASLEDIE = Страна получает название, которое переживёт её саму. Славу, о которой в чужих странах будут читать как о чужой.
BE2_FD_YUGO_NASLEDIE_EN = The country gets a name that will outlive it. A glory that will be read in other countries as somebody else's.
BE2_FD_YUGO_NAUKA = Университеты Белграда, Загреба и Любляны получают общий бюджет, общие журналы и общий список профессоров, готовых переехать в чужой город.
BE2_FD_YUGO_NAUKA_EN = The universities of Belgrade, Zagreb and Ljubljana get a shared budget, shared journals, and a shared list of professors willing to move to another city.
BE2_FD_YUGO_OS = В Берлине подписывают протокол, который называют защитой от любых неожиданностей. Сразу после подписи на юго-востоке страны поднимается восстание демократов: они считают, что неожиданность уже случилась. Восставшие занимают Скопье, Ниш, Приштину и Битолу и объявляют себя настоящей Югославией.
BE2_FD_YUGO_OS_EN = A protocol is signed in Berlin, called protection against any surprises. Right after the signature a rising of democrats starts in the south-east of the country: they believe the surprise has already happened. The rebels take Skopje, Nis, Pristina and Bitola and declare themselves the true Yugoslavia.
BE2_FD_YUGO_PARTIJA = Партии республик сливаются в одну. Тот, кто не вступил, больше не может занимать должность, и учителя узнают об этом раньше учеников.
BE2_FD_YUGO_PARTIJA_EN = The republic parties merge into one. Those who did not join can no longer hold office, and the teachers learn about it before the pupils.
BE2_FD_YUGO_PETNOL = Нефтяники Славонии и угольщики Боснии переходят в ведение союзного министерства. Запасы страны наконец видны в одном отчёте.
BE2_FD_YUGO_PETNOL_EN = The oilmen of Slavonia and the coalmen of Bosnia come under the federal ministry. The reserves of the country are finally visible in a single report.
BE2_FD_YUGO_PLAN5 = Белград берёт темп: пять лет, пять отраслей, ни одного разговора о том, что будет, если план не выполнен. Каждый построенный завод считается отдельным подвигом, и отчёт о нём идёт в столицу рекой бумаги.
BE2_FD_YUGO_PLAN5_EN = Belgrade sets the pace: five years, five industries, not one word about what happens if the plan is not met. Every plant built counts as a feat of its own, and the report on it flows to the capital as a river of paper.
BE2_FD_YUGO_POLOPRIM = Земельные фонды республик сводят в один, и наделы между Воеводиной, Прилепом и Косовом распределяют по одной системе.
BE2_FD_YUGO_POLOPRIM_EN = The land funds of the republics are merged into one, and allotments between the Vojvodina, Prilep and Kosovo are distributed by a single system.
BE2_FD_YUGO_PORT = Риека и Копер переходят под союзную морскую службу. Страна учится грузить и выгружать сама, а не платить чужим перевозчикам за то же самое.
BE2_FD_YUGO_PORT_EN = Rijeka and Koper come under the federal maritime service. The country learns to load and unload itself instead of paying foreign carriers for the same work.
BE2_FD_YUGO_PROFSOYU = Профсоюзы становятся единственной силой, которую признают и заводчики, и бюрократы. Они требуют прибавки, её не дают, и забастовка становится частью рабочего года.
BE2_FD_YUGO_PROFSOYU_EN = The trade unions become the one force that both the factory owners and the bureaucrats recognise. They ask for a raise, they are refused, and the strike becomes part of the working year.
BE2_FD_YUGO_RAZVAL = Союз распадается по швам: Словения уходит на север, Хорватия - на запад, за ними тянется Черногория со всем югом. В Белграде остаётся урезанное государство, которое никто больше не называет Югославией, кроме тех, кто при ней остался.
BE2_FD_YUGO_RAZVAL_EN = The union falls apart: Slovenia leaves to the north, Croatia to the west, and Montenegro trails after them with the whole south. In Belgrade a shrunken state remains, which nobody calls Yugoslavia any more, except those who stayed with it.
BE2_FD_YUGO_ROSSIYA = В Белград приезжают люди, у которых есть своё мнение о том, кому принадлежит страна, и разговор идёт именно об этом. Приехавшие уезжают ни с чем.
BE2_FD_YUGO_ROSSIYA_EN = People arrive in Belgrade with their own opinion about who the country belongs to, and the conversation is exactly about that. Those who came leave with nothing.
BE2_FD_YUGO_RYNOK = Таможни между республиками упраздняют, и товар идёт через всю страну свободно. Свои производители жалуются на дешёвый импорт, и жалобы доходят до Белграда вовремя.
BE2_FD_YUGO_RYNOK_EN = The customs posts between the republics are abolished, and goods move freely across the whole country. Local producers complain about cheap imports, and the complaints reach Belgrade in time.
BE2_FD_YUGO_SABOR = Союзное собрание переезжает в Белград и начинает решать всё, от судьбы Хорватии до цены на сахар. Заседания идут долго, решения принимают в обед.
BE2_FD_YUGO_SABOR_EN = The federal assembly moves to Belgrade and begins to decide everything, from the fate of Croatia to the price of sugar. The sessions are long, and the decisions are made at lunch.
BE2_FD_YUGO_STAL = Заводы в Зенице, Смедерево и Нише работают на общую закупку сырья и общий сбыт. Директоров в Белграде меняют, не спрашивая никого из них.
BE2_FD_YUGO_STAL_EN = The plants at Zenica, Smederevo and Nis buy their ore together and sell together. The directors in Belgrade are changed without asking any of them.
BE2_FD_YUGO_SUD = Суды республик становятся частью союзной системы. Дело, начатое в Скопье, можно теперь оспорить в Загребе, и бумаги едут тем же коридором, что и санитарные.
BE2_FD_YUGO_SUD_EN = The republic courts become part of the federal system. A case opened in Skopje can now be appealed in Zagreb, and the papers travel along the same corridor as the sanitary ones.
BE2_FD_YUGO_SVOBODA = Границы между республиками упраздняют, валюту делают общей, и человек, переехавший из Скопья в Любляну, не чувствует себя иностранцем. Это стоит дорого и длится недолго.
BE2_FD_YUGO_SVOBODA_EN = The borders between the republics are abolished, the currency is made common, and a man who moves from Skopje to Ljubljana does not feel like a foreigner. It is expensive, and it does not last.
BE2_FD_YUGO_USTAV = Пишут устав, который заменит конституцию. Он длиннее любой европейской конституции, и в нём ни разу не сказано, кто главнее.
BE2_FD_YUGO_USTAV_EN = They write a statute to stand in for a constitution. It is longer than any constitution in Europe, and it never says who is the senior partner.
BE2_FD_YUGO_VOEN_REVOL = Генералы решают, что страна движется слишком медленно. Белград сменяют, партию распускают, а договоры с соседями пересматривают за ночь, пока идёт мобилизация.
BE2_FD_YUGO_VOEN_REVOL_EN = The generals decide the country is moving too slowly. Belgrade is changed, the party is dissolved, and the treaties with the neighbours are redone overnight while the mobilisation runs.
BE2_FD_YUGO_VOINA = Страна идёт войной и проигрывает её за шесть недель. От прежней Югославии остаются горные деревни, несколько заводов и очень длинный список взаимных претензий.
BE2_FD_YUGO_VOINA_EN = The country goes to war and loses it in six weeks. Of the former Yugoslavia there remain mountain villages, a few plants, and a very long list of mutual claims.
BE2_FD_YUGO_VOJSKA = Семь армий республик становятся одной. Корпуса сводят к общему уставу, мундиры шьют на одном складе, и офицеров из Белграда, Загреба и Любляны учат говорить приказания одинаково.
BE2_FD_YUGO_VOJSKA_EN = Seven republic armies become one. Corps are drawn up under a common regulation, uniforms are cut from a single depot, and officers from Belgrade, Zagreb and Ljubljana are taught to give orders alike.
BE2_FD_YUGO_VOJSKA_TECH = Военные училища всех республик сливаются в одно. Курсанты из Приштины и Скопья впервые слушают одну лекцию и сдают один экзамен.
BE2_FD_YUGO_VOJSKA_TECH_EN = The military academies of all republics merge into one. Cadets from Pristina and Skopje for the first time hear one lecture and sit one exam.
BE2_FD_YUGO_VOSTOK = Оружейные поставки идут в обе стороны, и страна берёт кредит под те же обязательства. Говорят: подписано. И о том, что будет после, не говорит никто.
BE2_FD_YUGO_VOSTOK_EN = Arms flow in both directions, and the country takes a loan against the same commitments. They say it was signed. And nobody says what comes after.
BE2_FD_YUGO_VREMYA = Страна перестаёт покупать чужую технику и начинает производить свою. Это дороже и хуже, зато на вопрос «чья это марка» есть ответ, и ответ без запинки.
BE2_FD_YUGO_VREMYA_EN = The country stops buying foreign machinery and starts making its own. It is dearer and worse, but the question of whose make it is has an answer, and the answer comes without hesitation.
BE2_FD_YUGO_VYSELID = Сербы, хорваты и мусульмане едут на новые земли, и республики получают людей вместо тех, кто уехал. Каждая область заселена своими, и через двадцать лет это перестанет быть заметно.
BE2_FD_YUGO_VYSELID_EN = Serbs, Croats and Muslims move onto new land, and the republics get people in place of those who left. Each region is settled with its own kind, and in twenty years this will no longer be noticeable.
BE2_FD_YUGO_ZAPAD = Уголь и медь идут на запад, деньги приходят оттуда же, и страна постепенно перестаёт смотреть на восток. Это называется нейтралитетом, и нейтралитет кончается вместе с договором.
BE2_FD_YUGO_ZAPAD_EN = Coal and copper go west, money comes from there too, and the country slowly stops looking east. This is called neutrality, and neutrality ends together with the agreement.
BE2_FD_YUGO_ZELEZNICA = Белград, Загреб и Скопье соединяют одной сетью. Вагоны идут по общему расписанию, и пассажир на границе больше не ищет свой поезд в другом окне.
BE2_FD_YUGO_ZELEZNICA_EN = Belgrade, Zagreb and Skopje are joined by one net. Cars run on one timetable, and a passenger at the border no longer looks for his train in another window.
BE2_FD_YUGO_ZVEZDA = Флаг страны вешают над каждой школой, и дети выучивают название государства раньше названия своего города. Некоторые из них потом разрушат это государство и переживут его.
BE2_FD_YUGO_ZVEZDA_EN = The flag goes up over every school, and the children learn the name of the state before the name of their own city. Some of them will later destroy the state and outlive it.
