BE2_F_YUGO_RYNOK = Общий рынок
BE2_F_YUGO_RYNOK_EN = The Common Market
BE2_F_YUGO_SABOR = Народное собрание
BE2_F_YUGO_SABOR_EN = The National Assembly
BE2_F_YUGO_STAL = Металлургия
BE2_F_YUGO_STAL_EN = The Steelworks
BE2_F_YUGO_SUD = Суды и администрация
BE2_F_YUGO_SUD_EN = The Courts and the Administration
BE2_F_YUGO_SVOBODA = Свобода и порядок
BE2_F_YUGO_SVOBODA_EN = Freedom and Order
BE2_F_YUGO_USTAV = Устав союза
BE2_F_YUGO_USTAV_EN = The Statute of the Union
BE2_F_YUGO_VOEN_REVOL = Военная революция
