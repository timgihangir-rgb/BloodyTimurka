BE2_F_GERQ_NORDSEE = Северное море
BE2_F_GERQ_NORDSEE_EN = The North Sea
BE2_F_GERQ_RATIONALISIERUNG = Рационализация
BE2_F_GERQ_RATIONALISIERUNG_EN = Rationalisation
BE2_F_GERQ_REICHSWEHR = Рейхсвер
BE2_F_GERQ_REICHSWEHR_EN = The Reichswehr
BE2_F_GERQ_RESTRUKTURIERUNG = Реструктуризация
BE2_F_GERQ_RESTRUKTURIERUNG_EN = Restructuring
BE2_F_GERQ_RHEINKOLONIEN = Рейнские земли
BE2_F_GERQ_RHEINKOLONIEN_EN = The Rhineland
BE2_F_GERQ_RUHR = Рурский уголь
BE2_F_GERQ_RUHR_EN = Ruhr Coal
BE2_F_GERQ_SPD = Социал-демократия
BE2_F_GERQ_SPD_EN = Social Democracy
BE2_F_GERQ_STABILITAET = Стабильность
BE2_F_GERQ_STABILITAET_EN = Stability
BE2_F_GERQ_SUDWESTEN = Юго-запад
BE2_F_GERQ_SUDWESTEN_EN = The Southwest
BE2_F_GERQ_VERFASSUNG = Конституция
BE2_F_GERQ_VERFASSUNG_EN = The Constitution
BE2_F_GERQ_VERSAMMLUNG = Национальное собрание
BE2_F_GERQ_VERSAMMLUNG_EN = National Assembly
BE2_F_GERQ_VORWARTS = «Вперёд, ребята»
BE2_F_GERQ_VORWARTS_EN = "Forward, men"
BE2_F_GERQ_WAHLRECHT = Избирательное право
BE2_F_GERQ_WAHLRECHT_EN = The Right to Vote
BE2_F_GERQ_WEHRREFORM = Реформа армии
BE2_F_GERQ_WEHRREFORM_EN = Army Reform

BE2_FD_GERQ_ARBEITSDIENST = Безработных отправляют строить дороги, и они действительно строят. Проблема занятости остаётся, но становится тише.
BE2_FD_GERQ_ARBEITSDIENST_EN = The unemployed are sent to build roads, and they really build. The employment problem stays but gets quieter.
BE2_FD_GERQ_BANKEN = Банки переходят под контроль государства и перестают закрываться по первому слуху. Страна теряет часть независимости и часть паники.
BE2_FD_GERQ_BANKEN_EN = The banks come under state control and stop closing at the first rumour. The country loses some independence and some panic.
BE2_FD_GERQ_BUNDESRAT = Земли получают право говорить в один голос. Центра слабеет, зато страна не рвётся на части при первом же кризисе.
BE2_FD_GERQ_BUNDESRAT_EN = The states get the right to speak with one voice. The centre weakens, but the country does not tear apart at the first crisis.
BE2_FD_GERQ_EUROPAHAUPTSTADT = Страна, выросшая на угле и долгах, заявляет, что её столица - там, откуда можно давить на всех. Это стоит дороже всего остального вместе взятого.
BE2_FD_GERQ_EUROPAHAUPTSTADT_EN = A country grown on coal and debt claims that its capital is wherever it can press everyone from. This costs more than everything else combined.
BE2_FD_GERQ_GEWERKSCHAFT = Рабочие перестают быть наёмной силой и становятся стороной договора. Зарплаты растут вместе с ценами, а страна - вместе с долгом.
BE2_FD_GERQ_GEWERKSCHAFT_EN = Workers stop being hired help and become a party to the contract. Wages rise with prices, and the country rises with debt.
BE2_FD_GERQ_GOLDMARK = Ремонт денег начинают с самой простой вещи: перестают печатать лишнее. Рынок оживает, а с ним - сомнения о происхождении этих денег.
BE2_FD_GERQ_GOLDMARK_EN = Money repair starts with the simplest thing: stop printing extra. The market revives, and with it doubts about where this money came from.
BE2_FD_GERQ_HAMBURG = Вольный город входит в состав государства не силой, а договором. Первый случай, когда республика что-то получила, а не отняла.
BE2_FD_GERQ_HAMBURG_EN = The free city joins the state not by force but by treaty. The first case of the republic receiving something rather than taking it.
BE2_FD_GERQ_INDUSTRIE = Страна делает ставку на сталь и проигрывает, когда сталь не нужна. Но она умеет делать её быстрее соседей.
BE2_FD_GERQ_INDUSTRIE_EN = The country bets on steel and loses when steel is not needed. But it can make it faster than its neighbours.
BE2_FD_GERQ_KAMPFBUND = Добровольцы, для которых республика - это гражданская война, которую они не хотели. Страна получает армию, которая воюет с гражданами охотнее, чем с врагами.
BE2_FD_GERQ_KAMPFBUND_EN = Volunteers for whom the republic is the civil war they did not want. The country gets an army that fights citizens more willingly than enemies.
BE2_FD_GERQ_KOALITION = Страна решает не выбирать, а договариваться. Правление работает медленнее и держится дольше.
BE2_FD_GERQ_KOALITION_EN = The country decides not to vote but to negotiate. Government works more slowly and lasts longer.
BE2_FD_GERQ_LUFTWAFFE = Республика, которой запрещали иметь авиацию, строит её тайком и называет это гражданской авиацией.
BE2_FD_GERQ_LUFTWAFFE_EN = A republic forbidden to have an air force builds it in secret and calls it civil aviation.
BE2_FD_GERQ_NORDSEE = Порты вместо суши: страна сдаёт то, что нельзя удержать, и берёт то, что нельзя обойти.
BE2_FD_GERQ_NORDSEE_EN = Harbours instead of land: the country gives up what cannot be held and takes what cannot be bypassed.
BE2_FD_GERQ_RATIONALISIERUNG = Закрывают лишнее, увольняют лишних и называют это эффективностью. Показатели растут, семьи переезжают в другие города.
BE2_FD_GERQ_RATIONALISIERUNG_EN = Unnecessary things are closed, unnecessary people are dismissed, and it is called efficiency. The figures grow, the families move to other cities.
BE2_FD_GERQ_REICHSWEHR = Армия, которой запрещено учиться воевать и разрешено учиться держать строй. Этого хватает, чтобы не быть побеждённым сразу.
BE2_FD_GERQ_REICHSWEHR_EN = An army forbidden from learning to fight and allowed to learn to hold line. That is enough not to be defeated at once.
BE2_FD_GERQ_RESTRUKTURIERUNG = Страна переживает кризис, снимая с себя то, что не приносит дохода. Республика выживает и перестаёт быть прежней.
BE2_FD_GERQ_RESTRUKTURIERUNG_EN = The country survives a crisis by shedding what brings no income. The republic survives and stops being the old one.
BE2_FD_GERQ_RHEINKOLONIEN = Провинции на западе, которые республика получила вместе с её восточными. Страна снова спорит с соседями о границе.
BE2_FD_GERQ_RHEINKOLONIEN_EN = The western provinces the republic received along with its eastern ones. The country argues with its neighbours about a border again.
BE2_FD_GERQ_RUHR = Гибель рудника стоит республике дороже, чем дешёвый уголь того стоил бы. Профсоюз требует, государство платит, шахта работает.
BE2_FD_GERQ_RUHR_EN = The death of a mine costs the republic more than cheap coal would have. The union demands, the state pays, the mine works.
BE2_FD_GERQ_SPD = Партия, которая обещает всё сразу и поэтому выигрывает всё сразу. Правление становится лучше, а ожидания - выше.
BE2_FD_GERQ_SPD_EN = A party that promises everything at once and therefore wins everything at once. Government gets better, expectations get higher.
BE2_FD_GERQ_STABILITAET = Страна закупает спокойствие: индексация зарплат, субсидии угольной промышленности и тихие соглашения вместо забастовок.
BE2_FD_GERQ_STABILITAET_EN = The country buys calm: wage indexation, coal subsidies and quiet deals instead of strikes.
BE2_FD_GERQ_SUDWESTEN = Южные земли присоединяются, и республика впервые видит море там, где раньше была граница.
BE2_FD_GERQ_SUDWESTEN_EN = The southern lands join, and the republic sees the sea for the first time where a border used to be.
BE2_FD_GERQ_VERFASSUNG = Писаные правила, спорные статьи и один вопрос без ответа: кто командование в кризисе. Республика держится на этой бумаге.
BE2_FD_GERQ_VERFASSUNG_EN = Written rules, disputed articles and one unanswered question: who commands in a crisis. The republic holds on this paper.
BE2_FD_GERQ_VERSAMMLUNG = Страна, у которой отняли корону, пробует говорить сама. Собрание проходит плохо, но республика начинается именно с этого.
BE2_FD_GERQ_VERSAMMLUNG_EN = A country whose crown has been taken away tries to speak for itself. The assembly goes badly, but a republic begins exactly here.
BE2_FD_GERQ_VORWARTS = Полковник-идеолог приводит войска с собой, и они идут туда, куда он скажет. Войска становятся сильнее и менее управляемыми.
BE2_FD_GERQ_VORWARTS_EN = A colonel-ideologue leads the troops personally, and they go where he says. The army grows stronger and less controllable.
BE2_FD_GERQ_WAHLRECHT = Женщины получают голос раньше, чем большинство мужчин голосуют за партию. Страна делает шаг, который потом не отменяет.
BE2_FD_GERQ_WAHLRECHT_EN = Women get the vote before most men vote for a party. The country takes a step it will not undo.
BE2_FD_GERQ_WEHRREFORM = Новая техника вместо старой: она дороже, медленнее и решает, что будет через пять лет.
BE2_FD_GERQ_WEHRREFORM_EN = New equipment instead of old: costlier, slower, and it decides what happens in five years.
