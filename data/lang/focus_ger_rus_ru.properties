# Переводы новых фокусов Рейха и СССР (34 фокуса).
# Старые 19+19 фокусов уже переведены в доноре - здесь только новые.
# Вливается в game/languages/focus/Bundle_ru.properties скриптом tools/merge_props.py.

# ===================== РЕЙХ =====================
BE2_F_GER_LUFT = Создание люфтваффе
BE2_F_GER_LUFT_EN = Creation of the Luftwaffe
BE2_FD_GER_LUFT = Гимлер получает собственные военно-воздушные силы: десятки тысяч новых самолётов, своя авиация вместо старой имперской. Удар с воздуха становится главным оружием войны.
BE2_FD_GER_LUFT_EN = The Luftwaffe becomes an independent arm of its own: tens of thousands of new aircraft, a German air force instead of the old imperial one. Air power becomes the main weapon of war.

BE2_F_GER_AUTARKY = Автаркия
BE2_F_GER_AUTARKY_EN = Autarky
BE2_FD_GER_AUTARKY = Страна закрывается от мирового рынка и всё нужное производит сама. Экономика растёт, но страна перестаёт получать технологии извне - наука при этом замедляется.
BE2_FD_GER_AUTARKY_EN = The country closes itself off from world trade and makes everything itself. The economy grows, but the country stops receiving technology from abroad - and research slows down.

BE2_F_GER_INDUSTRY = Национальная промышленность
BE2_F_GER_INDUSTRY_EN = National Industry
BE2_FD_GER_INDUSTRY = Шахты, сталелитейни и заводы переходят под прямое управление государства. Производство и рост экономики заметно ускоряются на десятилетие.
BE2_FD_GER_INDUSTRY_EN = Mines, steelworks and factories come under direct state control. Production and economic growth speed up noticeably for a decade.

BE2_F_GER_RASTERFARM = Распоряжение Райера
BE2_F_GER_RASTERFARM_EN = The Reich Labour Service Decree
BE2_FD_GER_RASTERFARM = Молодые немцы отправляются в поля Рейха на пять месяцев, а крестьяне принудительно сдают часть урожая государству. Народ растёт, еды и денег в казне становится больше.
BE2_FD_GER_RASTERFARM_EN = Young Germans are sent to work on Reich farms for five months, and farmers hand over part of the harvest to the state. The population grows and the state gets more food and money.

BE2_F_GER_ERDUNG = Импорт рабочей силы
BE2_F_GER_ERDUNG_EN = Import of Labour
BE2_FD_GER_ERDUNG = Страна покупает и вывозит работников со всей Европы: стройки и военные заводы набирают людей. Мобильный резерв и подвижность войск растут, но растёт и народное недовольство.
BE2_FD_GER_ERDUNG_EN = The country buys and imports workers from all over Europe: construction sites and war factories recruit people. Manpower and army mobility grow, but so does popular discontent.

BE2_F_GER_RUHR = Рурский уголь
BE2_F_GER_RUHR_EN = Ruhr Coal
BE2_FD_GER_RUHR = Рур даёт стране половину угля и стали. Выплавки и транспорт остаются на максимуме - промышленность не знает перебоев.
BE2_FD_GER_RUHR_EN = The Ruhr gives the country half of its coal and steel. Smelting and transport stay at maximum - industry knows no interruptions.

BE2_F_GER_VOLKSWAGEN = Завод «Фольксваген»
BE2_F_GER_VOLKSWAGEN_EN = The Volkswagen Plant
BE2_FD_GER_VOLKSWAGEN = Один завод в центре страны даёт технику для армии и дешёвые автомобили для немцев. Армия становится быстрее, в казну идут налоги с внутренней торговли.
BE2_FD_GER_VOLKSWAGEN_EN = A single plant in the heart of the country produces military vehicles and cheap cars for Germans. The army gets faster, and internal trade brings in taxes.

BE2_F_GER_UBOAT = Подводные лодки
BE2_F_GER_UBOAT_EN = The U-boats
BE2_FD_GER_UBOAT = Сотни лодок выходят в Атлантику и отрезают Британии пути к сырью. Британский флот уходит на перехват, потери обеих сторон растут.
BE2_FD_GER_UBOAT_EN = Hundreds of boats head into the Atlantic and cut Britain off from its raw materials. The British fleet is drawn away to hunt them and losses grow on both sides.

BE2_F_GER_ATLAS = Тяжёлый танк «Тигр»
BE2_F_GER_ATLAS_EN = The Heavy Tiger Tank
BE2_FD_GER_ATLAS = Новая машина в пятьдесят тонн с толстой бронёй и мощной пушкой. Штурм и оборона становятся значительно сильнее.
BE2_FD_GER_ATLAS_EN = A new fifty-ton machine with thick armour and a powerful gun. Assault and defence become considerably stronger.

BE2_F_GER_ATLANTIS = Господство в Атлантике
BE2_F_GER_ATLANTIS_EN = Mastery of the Atlantic
BE2_FD_GER_ATLANTIS = Эскадра закрывает океан: чужие корабли не проходят, а дипломаты всех стран считаются с Берлином. Мировая торговля идёт мимо Германии.
BE2_FD_GER_ATLANTIS_EN = The fleet closes the ocean: foreign ships do not pass and every country's diplomats take Berlin into account. World trade bypasses Germany.

BE2_F_GER_RHEIN = Ремилитаризация Рейна
BE2_F_GER_RHEIN_EN = Remilitarize the Rhineland
BE2_FD_GER_RHEIN = Вермахт входит в демилитаризованную зону Рейна, и Франция не решается его выбить. Армия усиливается, но Париж и Лондон видят в этом вызов.
BE2_FD_GER_RHEIN_EN = The Wehrmacht marches into the demilitarised Rhineland and France does not dare to expel it. The army is strengthened, but Paris and London see this as a challenge.

BE2_F_GER_ANSCHLUSS = Аншлюс Австрии
BE2_F_GER_ANSCHLUSS_EN = Anschluss of Austria
BE2_FD_GER_ANSCHLUSS = Австрия входит в состав Рейха: её земли переходят под немецкое управление, австрийские войска вливаются в вермахт. Соседи встревожены.
BE2_FD_GER_ANSCHLUSS_EN = Austria joins the Reich entirely: millions of people come under German rule and the Austrian army is absorbed into the Wehrmacht. The neighbours are alarmed.

BE2_F_GER_SUDETY = Судетская область
BE2_F_GER_SUDETY_EN = The Sudetenland
BE2_FD_GER_SUDETY = Немецкое население приграничных земель переходит под управление Берлина вместе с промышленностью и людьми. Пограничье закрывается, но Франция и СССР берутся за оружие.
BE2_FD_GER_SUDETY_EN = The German population of the borderlands passes to Berlin with its industry and people. The border is closed, but France and the USSR reach for their weapons.

BE2_F_GER_MEMEL = Мемель и Клайпеда
BE2_F_GER_MEMEL_EN = Memel and Klaipeda
BE2_FD_GER_MEMEL = Клайпеда и прилегающие земли отоходят к Германии. Балтийский флот получает удобные гавани, а граница в Восточной Пруссии становится спокойнее.
BE2_FD_GER_MEMEL_EN = Klaipeda and the lands around it go to Germany. The Baltic fleet gets convenient harbours and the border in East Prussia becomes calmer.

BE2_F_GER_DANZIG = Данциг и коридор
BE2_F_GER_DANZIG_EN = Danzig and the Corridor
BE2_FD_GER_DANZIG = Данциг и коридор к морю становятся немецкими. Армия получает выход к Балтике, но Польша и её покровители видят в этом прямое нарушение договоров.
BE2_FD_GER_DANZIG_EN = Danzig and the corridor to the sea become German. The army gains access to the Baltic, but Poland and its protectors see a direct violation of treaties.

BE2_F_GER_WESTWALL = Западный вал
BE2_F_GER_WESTWALL_EN = The West Wall
BE2_FD_GER_WESTWALL = Длинная линия укреплений, тысячи бетонных башен и минных полей от Ла-Манша до Швейцарии. Оборона границы становится почти непреодолимой.
BE2_FD_GER_WESTWALL_EN = A long line of fortifications, thousands of concrete towers and minefields from La Manche to Switzerland. The border defence becomes almost impossible to break.

# ===================== СССР =====================
BE2_F_RUS_RAIL = Уральская магистраль
BE2_F_RUS_RAIL_EN = The Urals Line
BE2_FD_RUS_RAIL = Сотни километров рельсов и станций связывают Урал с центром и портами. Страна перестаёт буксовать на месте: войска и грузы идут быстро, управление дорогой дешевеет.
BE2_FD_RUS_RAIL_EN = Hundreds of kilometres of rails and stations link the Urals with the centre and the ports. The country stops getting stuck in one place: troops and goods move fast and running the line becomes cheaper.

BE2_F_RUS_TRACTORS = Сталинградский тракторный завод
BE2_F_RUS_TRACTORS_EN = The Stalingrad Tractor Plant
BE2_FD_RUS_TRACTORS = Завод даёт стране тракторы для полей и корпуса для танков. Еды больше, деревня работает, а броня встаёт на конвейер.
BE2_FD_RUS_TRACTORS_EN = The plant gives the country tractors for the fields and hulls for tanks. More food, a working countryside and armour on the assembly line.

BE2_F_RUS_SVALOV = Магнитогорский комбинат
BE2_F_RUS_SVALOV_EN = The Magnitogorsk Combine
BE2_FD_RUS_SVALOV = Руда Урала перерабатывается на месте: страна получает столько металла, сколько раньше не выплавляла. Производство и военные заказы растут.
BE2_FD_RUS_SVALOV_EN = Ural ore is processed on the spot: the country gets more metal than it ever smelted before. Production and military orders grow.

BE2_F_RUS_AVIATION = Авиационный завод
BE2_F_RUS_AVIATION_EN = The Aviation Plant
BE2_FD_RUS_AVIATION = Сотни самолётов в год и настоящая авиационная школа. Ударная сила и скорость армии растут, молодые лётчики становятся силой.
BE2_FD_RUS_AVIATION_EN = Hundreds of aircraft a year and a real flying school. Strike power and army speed grow, and young pilots become a force in their own right.

BE2_F_RUS_MECH = Механизация Красной Армии
BE2_F_RUS_MECH_EN = Mechanisation of the Red Army
BE2_FD_RUS_MECH = Кавалерия уходит с поля боя, её место занимают танки и моторизованные корпуса. Войска двигаются втрое быстрее, а удары бьют глубже.
BE2_FD_RUS_MECH_EN = Cavalry leaves the battlefield and tanks and motorised corps take its place. Troops move three times faster and strikes go deeper.

BE2_F_RUS_PARADE = Военный парад
BE2_F_RUS_PARADE_EN = The Military Parade
BE2_FD_RUS_PARADE = Колонны войск проходят по Красной площади под салютом. Народ видит силу армии, солдаты и инженеры получают прибавку, весь мир пересчитывает планы соседей.
BE2_FD_RUS_PARADE_EN = Columns of troops march across Red Square to a salute. The people see the strength of the army, soldiers and engineers get a bonus, and the whole world recalculates its neighbours' plans.

BE2_F_RUS_GULAG = Строительство каналов
BE2_F_RUS_GULAG_EN = Canal Construction
BE2_FD_RUS_GULAG = Новые каналы и дороги между городами, которые строят заключённые. Страна перестаёт буксовать на месте, в казну идут доходы, а призывной ресурс общества тает.
BE2_FD_RUS_GULAG_EN = New canals and roads between the cities, built by prisoners. The country stops getting stuck in one place, the treasury gets income, and the pool of recruitable people melts away.

BE2_F_RUS_OFFICERS = Подготовка офицерского корпуса
BE2_F_RUS_OFFICERS_EN = Training of the Officer Corps
BE2_FD_RUS_OFFICERS = Школы выпускают офицеров, которые умеют управлять тысячами людей и машинами. Наступление и оборона становятся организованнее, а техника используется умелее.
BE2_FD_RUS_OFFICERS_EN = The schools produce officers who can command thousands of men and machines. Assault and defence become better organised and equipment is used more skilfully.

BE2_F_RUS_CULT = Культура и наука
BE2_F_RUS_CULT_EN = Culture and Science
BE2_FD_RUS_CULT = Школы, институты и лаборатории получают деньги и защиту. Исследования идут быстрее, а в городах появляется то, о чём в столице не принято говорить вслух.
BE2_FD_RUS_CULT_EN = Schools, institutes and laboratories get money and protection. Research moves faster and the cities gain what is not discussed aloud in the capital.

BE2_F_RUS_PROPAGANDA = Идеологическая работа
BE2_F_RUS_PROPAGANDA_EN = Ideological Work
BE2_FD_RUS_PROPAGANDA = Радио, газеты и клубы объясняют населению, как жить. Народное недовольство утихает, управление страной становится плотнее, соседи замечают пропаганду.
BE2_FD_RUS_PROPAGANDA_EN = Radio, newspapers and clubs explain to the population how it is supposed to live. Discontent dies down, control over the country tightens, and the neighbours notice the propaganda.

BE2_F_RUS_SOVNARKOM = Перестройка Совнаркома
BE2_F_RUS_SOVNARKOM_EN = Reorganisation of the Sovnarkom
BE2_FD_RUS_SOVNARKOM = Централизованное управление вместо ведомственных разногласий: решения принимаются быстрее, налоги собираются лучше, страна устойчивее.
BE2_FD_RUS_SOVNARKOM_EN = Centralised administration instead of departmental disagreements: decisions are made faster, taxes are collected better and the country is more stable.

BE2_F_RUS_DEFENCE = Рубеж обороны
BE2_F_RUS_DEFENCE_EN = The Defence Line
BE2_FD_RUS_DEFENCE = Заранее подготовленные рубежи, противотанковые рвы и заминированные поля на всём западном подходе. Прорваться почти невозможно, но на них уходят все деньги.
BE2_FD_RUS_DEFENCE_EN = Prepared lines, anti-tank ditches and minefields along the whole western approach. Breaking through is almost impossible, but all the money goes into them.

BE2_F_RUS_MOSCOW = Битва за Москву
BE2_F_RUS_MOSCOW_EN = The Battle of Moscow
BE2_FD_RUS_MOSCOW = Немецкие армии остановлены и отброшены от столицы. Страна узнаёт, что может защититься, а фронт стабилизируется.
BE2_FD_RUS_MOSCOW_EN = The German armies are stopped and thrown back from the capital. The country learns that it can defend itself, and the front stabilises.

BE2_F_RUS_STALINGRAD = Сталинград
BE2_F_RUS_STALINGRAD_EN = Stalingrad
BE2_FD_RUS_STALINGRAD = Город на Волге удержан: танки и пехота перемалывают наступающие дивизии. Войска втягиваются в войну по-настоящему, а дух народа крепнет.
BE2_FD_RUS_STALINGRAD_EN = The city on the Volga is held: tanks and infantry grind down the attacking divisions. The troops are drawn into the war for real, and the spirit of the people hardens.

BE2_F_RUS_WINTER = Зимняя война
BE2_F_RUS_WINTER_EN = The Winter War
BE2_FD_RUS_WINTER = Пограничный конфликт на северо-западе длится всю зиму. Противник увязнет в снегах, а советские дивизии получают боевой опыт и трофеи до великой войны.
BE2_FD_RUS_WINTER_EN = A border conflict in the north-west lasts through the whole winter. The enemy gets stuck in the snows, and the Soviet divisions gain experience and spoils before the great war.

BE2_F_RUS_BALTIC = Прибалтика
BE2_F_RUS_BALTIC_EN = The Baltic
BE2_FD_RUS_BALTIC = Страны Балтии становятся частью СССР вместе с портами и флотом. Население и живое мясо растут, но соседи перестают разговаривать.
BE2_FD_RUS_BALTIC_EN = The Baltic states become part of the USSR together with their ports and fleets. Population and manpower grow, but the neighbours stop talking.

# ----------------- гражданская война -----------------
BE2_F_GER_CIVILWAR = Расправа в Берлине
BE2_F_GER_CIVILWAR_EN = Reckoning in Berlin
BE2_FD_GER_CIVILWAR = Война на два фронта, измотанная страна и генералы за спиной фюрера. На севере и западе армии разваливаются, командование теряет власть над провинциями. Из Германии отделяется монархия с императором во главе - она забирает те земли, где немцев больше всего, и берёт их в гражданскую войну.
BE2_FD_GER_CIVILWAR_EN = A war on two fronts, a country worn out, and the generals behind the Fuehrer's back. In the north and west the armies fall apart and the command loses its provinces. A monarchy with an emperor at its head secedes from Germany, taking the lands where Germans are in the majority, and the two sides go to civil war.

BE2_F_RUS_CIVILWAR = Раскол в партии
BE2_F_RUS_CIVILWAR_EN = Split in the Party
BE2_FD_RUS_CIVILWAR = Победа выбила из партии всех, кто был против неё, и дала власть аппарату. Съезд снимает партию с руководства страной, а из СССР выделяется Российская Федерация - она забирает самые русские губернии и становится отдельным государством. Партия и федерация воюют друг с другом.
BE2_FD_RUS_CIVILWAR_EN = Victory purged the party of everyone opposed to it and handed power to the apparatus. The congress takes the party out of control of the country, and the Russian Federation secedes from the USSR, taking the most Russian provinces with it and becoming a state of its own. The party and the federation go to war with each other.
BE2_F_GER_AUTOBAN = Автобаны
BE2_F_GER_AUTOBAN_EN = Autobahns
BE2_FD_GER_AUTOBAN = Сеть скоростных магистралей связывает Рейх: промышленность получает новое дыхание.
BE2_FD_GER_AUTOBAN_EN = A network of highways ties the Reich together, giving industry new life.
BE2_F_GER_LABORFRONT = Трудовой фронт
BE2_F_GER_LABORFRONT_EN = Labour Front
BE2_FD_GER_LABORFRONT = Дисциплина рабочих и большие общественные работы поднимают производство.
BE2_FD_GER_LABORFRONT_EN = Worker discipline and massive public works raise output.
BE2_F_GER_PANZER = Танковая программа
BE2_F_GER_PANZER_EN = Panzer Programme
BE2_FD_GER_PANZER = Новые боевые машины сходят с конвейеров вермахта.
BE2_FD_GER_PANZER_EN = New fighting machines roll off the Wehrmacht lines.
BE2_F_GER_FLAK = Зенитные батареи
BE2_F_GER_FLAK_EN = Flak Batteries
BE2_FD_GER_FLAK = Противовоздушная оборона прикрывает заводы Рейха от налётов.
BE2_FD_GER_FLAK_EN = Air defences screen the factories of the Reich from raids.
BE2_F_GER_ROCKET = Ракеты «А-4»
BE2_F_GER_ROCKET_EN = A-4 Rockets
BE2_FD_GER_ROCKET = Пенемюнде: баллистическая ракета готова бить по дальним целям.
BE2_FD_GER_ROCKET_EN = Peenemünde makes ballistic missiles ready to strike distant targets.
BE2_F_GER_V2 = Оружие возмездия
BE2_F_GER_V2_EN = Vengeance Weapons
BE2_FD_GER_V2 = Фау-2 обрушивается на города противника.
BE2_FD_GER_V2_EN = V-2 rockets rain down on enemy cities.
BE2_F_GER_BULGAR = Присоединение Болгарии
BE2_F_GER_BULGAR_EN = Bulgaria Joins the Axis
BE2_FD_GER_BULGAR = Болгария вступает в союз с Рейхом.
BE2_FD_GER_BULGAR_EN = Bulgaria enters the alliance with the Reich.
BE2_F_GER_HUNGAR = Присоединение Венгрии
BE2_F_GER_HUNGAR_EN = Hungary Joins the Axis
BE2_FD_GER_HUNGAR = Венгрия получает спорные земли и вступает в союз.
BE2_FD_GER_HUNGAR_EN = Hungary gains disputed lands and joins the alliance.
BE2_F_GER_ROUMANIA = Союз с Румынией
BE2_F_GER_ROUMANIA_EN = Alliance with Romania
BE2_FD_GER_ROUMANIA = Румынская нефть идёт в Рейх в обмен на гарантии безопасности.
BE2_FD_GER_ROUMANIA_EN = Romanian oil flows to the Reich in exchange for security guarantees.
BE2_F_GER_FINLAND = Финляндия вступает в войну
BE2_F_GER_FINLAND_EN = Finland Enters the War
BE2_FD_GER_FINLAND = Финляндия берёт реванш за Зимнюю войну в союзе с Рейхом.
BE2_FD_GER_FINLAND_EN = Finland takes its revenge for the Winter War alongside the Reich.
BE2_F_GER_OSTLAND = Рейхскомиссариат Остланд
BE2_F_GER_OSTLAND_EN = Reichskommissariat Ostland
BE2_FD_GER_OSTLAND = Завоёванные восточные земли переходят под немецкую администрацию.
BE2_FD_GER_OSTLAND_EN = Conquered eastern lands pass under German administration.
BE2_F_GER_AFRIKA = Африканский корпус
BE2_F_GER_AFRIKA_EN = Afrika Korps
BE2_FD_GER_AFRIKA = Корпус Роммеля отправляется воевать в пустыню.
BE2_FD_GER_AFRIKA_EN = Rommel's corps sets out to fight in the desert.
BE2_F_GER_VOLKSSTURM = Фольксштурм
BE2_F_GER_VOLKSSTURM_EN = Volkssturm
BE2_FD_GER_VOLKSSTURM = Поднимаются последние резервы, оборона городов крепнет.
BE2_FD_GER_VOLKSSTURM_EN = The last reserves are raised and the defence of cities hardens.
BE2_F_GER_TOTALWAR = Тотальная война
BE2_F_GER_TOTALWAR_EN = Total War
BE2_FD_GER_TOTALWAR = Вся экономика Рейха переводится на военные рельсы.
BE2_FD_GER_TOTALWAR_EN = The whole Reich economy is put on a war footing.
BE2_F_RUS_MOLOTOV = Пакт Молотова-Риббентропа
BE2_F_RUS_MOLOTOV_EN = Molotov-Ribbentrop Pact
BE2_FD_RUS_MOLOTOV = Договор с Рейхом оборачивается союзом и разделом Восточной Европы.
