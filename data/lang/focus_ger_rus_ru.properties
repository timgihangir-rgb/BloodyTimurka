# качественные фокусы: аннексии, войны, протектораты
BE2_F_GER_POLEN = Польская кампания
BE2_F_GER_POLEN_EN = The Polish Campaign
BE2_FD_GER_POLEN = Данцигский вопрос решён по-немецки, и Польша отвечает войной. Вермахт переходит границу и берёт приграничные земли: Варшава под ударом, а западные соседи не решаются вмешиваться.
BE2_FD_GER_POLEN_EN = The Danzig question is settled the German way, and Poland answers with war. The Wehrmacht crosses the border and seizes the borderlands: Warsaw is under the blow, and the western neighbours do not dare to intervene.
BE2_F_GER_BOHEMIA = Протекторат Богемии и Моравии
BE2_F_GER_BOHEMIA_EN = The Protectorate of Bohemia and Moravia
BE2_FD_GER_BOHEMIA = Чешские земли становятся протекторатом Рейха: пражская промышленность работает на вермахт, а чешские войска присягают Берлину.
BE2_FD_GER_BOHEMIA_EN = The Czech lands become a protectorate of the Reich: Prague's industry works for the Wehrmacht, and the Czech army swears allegiance to Berlin.
BE2_F_GER_PETROGRAD = Наступление на Петроград
BE2_F_GER_PETROGRAD_EN = The Advance on Petrograd
BE2_FD_GER_PETROGRAD = Красная армия отступает к балтийским берегам, но столица не сдаётся: Берлин берёт пригороды и подступается к самому городу.
BE2_FD_GER_PETROGRAD_EN = The Red Army falls back to the Baltic shore, but the capital does not surrender: Berlin takes the suburbs and closes in on the city itself.
BE2_F_GER_CAUCASUS = Кавказская нефть
BE2_F_GER_CAUCASUS_EN = The Caucasian Oil
BE2_FD_GER_CAUCASUS = Нефтяные промыслы Кавказа переходят под контроль Рейха: топливо для танковых дивизий обеспечено, а Ставка получает удар в спину.
BE2_FD_GER_CAUCASUS_EN = The oil fields of the Caucasus fall under Reich control: fuel for the tank divisions is secured, and the General Staff is struck in the back.
BE2_F_GER_WESER = Везерюбунг
BE2_F_GER_WESER_EN = Operation Weseruebung
BE2_FD_GER_WESER = Дания и Норвегия падают за одну ночь: флот получает удобные базы, горные гарнизоны блокированы, а Скандинавия встаёт под германский контроль.
BE2_FD_GER_WESER_EN = Denmark and Norway fall in a single night: the fleet gets convenient bases, the mountain garrisons are sealed off, and Scandinavia comes under German control.
BE2_F_RUS_POLAND = Освободительный поход
BE2_F_RUS_POLAND_EN = The Liberation Campaign
BE2_FD_RUS_POLAND = Польская кампания начинается: Красная армия переходит границу и освобождает западные земли. Варшава теряет власть, а Запад предъявляет Москве самые ультимативные претензии.
BE2_FD_RUS_POLAND_EN = The Polish campaign begins: the Red Army crosses the border and liberates the western lands. Warsaw loses its rule, and the West lodges its most ultimatum-like claims with Moscow.
BE2_F_RUS_KAVKAZ = Кавказский фронт
BE2_F_RUS_KAVKAZ_EN = The Caucasian Front
BE2_FD_RUS_KAVKAZ = Сталинград прикрыл юг, и Красная армия выходит на Кавказ: нефтяные земли Закавказья переходят под контроль СССР, а Турция теряет последний плацдарм на южном фланге.
BE2_FD_RUS_KAVKAZ_EN = Stalingrad has covered the south and the Red Army drives into the Caucasus: the oil lands of Transcaucasia pass under Soviet control, and Turkey loses its last foothold on the southern flank.
BE2_F_RUS_UKRAINE = Освобождение Украины
BE2_F_RUS_UKRAINE_EN = The Liberation of Ukraine
BE2_FD_RUS_UKRAINE = Киев и вся Украина возвращаются в состав СССР: десятки миллионов людей, зерно и металлургия Запорожья под знамёнами Красной армии.
BE2_FD_RUS_UKRAINE_EN = Kyiv and all of Ukraine return to the USSR: tens of millions of people, the grain and the Zaporizhzhia steel mills under the banners of the Red Army.

