BE2_F_RUSQ_ZHELEZNICA_EN = The Railways

BE2_FD_RUSQ_AVIATSIYA = Страна строит самолёты, чтобы не покупать их у того, кто может решить, продавать ли.
BE2_FD_RUSQ_AVIATSIYA_EN = The country builds aircraft rather than buy them from whoever can decide whether to sell.
BE2_FD_RUSQ_BALTIKA = Земли у воды, которые оставались в стороне от обоих расколов. Теперь у страны есть выход, который никто не оспаривает.
BE2_FD_RUSQ_BALTIKA_EN = Lands by the water that stayed aside from both splits. Now the country has a way out that nobody disputes.
BE2_FD_RUSQ_FRONT = Сосед требует уступить побережье, и отказ становится приговором: война начинается не решением, а давлением.
BE2_FD_RUSQ_FRONT_EN = A neighbour demands a strip of the coast, and refusal becomes the sentence: war begins not by decision but by pressure.
BE2_FD_RUSQ_GIMNAZIYA = Школа для тех, кто умеет думать на бумаге. Страна получает несколько сотен человек, которые умеют считать быстрее остальных.
BE2_FD_RUSQ_GIMNAZIYA_EN = A school for those who can think on paper. The country gets a few hundred people who can count faster than the rest.
BE2_FD_RUSQ_IDEOLOGIYA = Страна ищет то, что делает её отличной от матери, и находит: слишком много раз это уже делали.
BE2_FD_RUSQ_IDEOLOGIYA_EN = The country looks for what makes it unlike its mother and finds it: too many people have already done that.
BE2_FD_RUSQ_KONSTITUTSIYA = Единственный документ, который в новой стране читают целиком. Он написан так, чтобы любая следующая власть могла им воспользоваться.
BE2_FD_RUSQ_KONSTITUTSIYA_EN = The only document in the new country that is read in full. It is written so that any next government could make use of it.
BE2_FD_RUSQ_KULTURA = Театр и выставка там, где раньше был только приказ. Город становится городом, а не точкой на карте.
BE2_FD_RUSQ_KULTURA_EN = A theatre and an exhibition where before there was only an order. The city becomes a city, not a dot on a map.
BE2_FD_RUSQ_MEKHANIZATSIYA = Лошади уходят из армии, но не сразу. Дорого, видимо, и надолго.
BE2_FD_RUSQ_MEKHANIZATSIYA_EN = Horses leave the army, but not immediately. It is expensive, visibly, and for a long time.
BE2_FD_RUSQ_MOSKOVSKAYA = Страна растёт в ту сторону, в которую её всё время смотрели, но не шли. Столица остаётся чужой, и теперь это обидно.
BE2_FD_RUSQ_MOSKOVSKAYA_EN = The country grows in the direction it kept looking at but never moving. The capital stays someone else’s, and now it stings.
BE2_FD_RUSQ_OPONENTS = Армия из тех, кто живёт в приграничных посёлках. Она знает местность лучше генерального штаба и обходится дороже.
BE2_FD_RUSQ_OPONENTS_EN = An army of the people who live in the border settlements. It knows the ground better than the general staff and costs more.
BE2_FD_RUSQ_PARLAMENT = Власть делится, и страна медленнее принимает решения и быстрее их исполняет.
BE2_FD_RUSQ_PARLAMENT_EN = Power is shared, and the country decides slower and executes faster.
BE2_FD_RUSQ_PORTY = Страна торгует через чужие причалы и платит за это процентом от каждого груза. Первое, что приходит на ум после флага, - это склад.
BE2_FD_RUSQ_PORTY_EN = The country trades through other people’s piers and pays a percentage on every cargo. The first thing that comes to mind after the flag is a warehouse.
BE2_FD_RUSQ_PRESSA = Газеты, которые можно читать, если повезёт. Первая оппозиция в новой стране появилась раньше, чем первая партия.
BE2_FD_RUSQ_PRESSA_EN = Newspapers you can read if you are lucky. The first opposition in the new country appeared before the first party.
BE2_FD_RUSQ_PREZIDENT = Страна выбирает одного человека, которому доверяет всё, и получает либо страну, либо человека, который её заменит.
BE2_FD_RUSQ_PREZIDENT_EN = The country picks one person to trust with everything, and gets either a country or a person who will replace it.
BE2_FD_RUSQ_PRIZYV = Каждый мужчина страны получает срок службы. Армия становится большой, и страна получает армию, которую надо кормить в мирное время.
BE2_FD_RUSQ_PRIZYV_EN = Every man in the country gets a term of service. The army becomes large, and the country gets an army it must feed in peacetime.
BE2_FD_RUSQ_PROMYSHLENNOST = Заводы строят быстро, потому что страна боится, что её догонит сосед. Это верная причина, но дорогая.
BE2_FD_RUSQ_PROMYSHLENNOST_EN = Plants are built fast because the country fears being overtaken by a neighbour. A sound reason, and an expensive one.
BE2_FD_RUSQ_SMOLENSK = Первая земля, взятая у соседа, а не полученная. Страна начинает воевать и постепенно перестаёт считать это новостью.
BE2_FD_RUSQ_SMOLENSK_EN = The first land taken from a neighbour rather than received. The country starts to wage war and gradually stops finding it news.
BE2_FD_RUSQ_STABILIZATSIYA = Шаги, которые не нравятся никому: дороже уголь, выше налоги, тише улицы. Через год половина этих мер отменяется.
BE2_FD_RUSQ_STABILIZATSIYA_EN = Measures nobody likes: dearer coal, higher taxes, quieter streets. Within a year half of them are repealed.
BE2_FD_RUSQ_TEPLIFIKATSIYA = Страна решает, что главное - это горячая вода в каждой квартире. Соседи считают это слабостью, пока не выясняется, что её перевели.
BE2_FD_RUSQ_TEPLIFIKATSIYA_EN = The country decides the main thing is hot water in every flat. Neighbours call it weakness until they learn it was exported.
BE2_FD_RUSQ_UCHREDITELNOYE = Страна, отколовшаяся от другой такой же, начинается с собрания, где спорят не о том, что делать, а о том, кто это будет делать.
BE2_FD_RUSQ_UCHREDITELNOYE_EN = A country that split off from another like it begins with an assembly that argues not about what to do but about who will do it.
BE2_FD_RUSQ_UGOL = Страна роет то, что лежит у неё под ногами, и обнаруживает, что качеством оно хуже, чем казалось.
BE2_FD_RUSQ_UGOL_EN = The country digs what lies under its feet and finds it is of worse quality than it seemed.
BE2_FD_RUSQ_UNIVERSITET = Институт, который переживёт страну: его выпускники найдут работу и в соседнем государстве, если это государство возникнет раньше.
BE2_FD_RUSQ_UNIVERSITET_EN = An institute that will outlive the country: its graduates will find work in a neighbour if that neighbour appears first.
BE2_FD_RUSQ_VOSSOEDINENIE = Республика идёт на восток и берёт то, что от неё когда-то отошло. Раскол закрывается, и страна оказывается в том размере, в котором её никто не ждал.
BE2_FD_RUSQ_VOSSOEDINENIE_EN = The republic marches east and takes what once parted from it. The split closes, and the country turns out to be bigger than anyone expected.
BE2_FD_RUSQ_ZAPAD = Отделившаяся половина смотрит на карту и видит на ней соседей. Планы начинают составлять в ту же сторону.
BE2_FD_RUSQ_ZAPAD_EN = The seceded half looks at a map and sees neighbours on it. Plans begin to be drawn in that direction.
BE2_FD_RUSQ_ZHELEZNICA = Линия, соединяющая запад со столицей, решает всё: с ней страна торгует, без неё - голодает.
BE2_FD_RUSQ_ZHELEZNICA_EN = The line joining the west to the capital solves everything: with it the country trades, without it it goes hungry.
