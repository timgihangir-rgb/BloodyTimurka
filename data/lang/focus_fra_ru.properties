BE2_FD_FRA_MOB = Призыв в армию объявлен по всей стране. Резерв переведён на военное положение, гражданская жизнь уступает место военной.
BE2_FD_FRA_MOB_EN = General mobilisation is declared across the country. The reserves are put on a war footing and civilian life gives way to the war effort.
BE2_FD_FRA_ARMY = Устаревшая система командования заменена. Генеральный штаб перестроен, офицерский корпус обновлён, армия получает современную структуру управления.
BE2_FD_FRA_ARMY_EN = The outdated command system is replaced. The general staff is reorganised, the officer corps renewed and the army gets a modern command structure.
BE2_FD_FRA_PLAN = Миллиарды франков идут на танки, авиацию и артиллерию. Производство растёт, но казна с каждым годом пустеет.
BE2_FD_FRA_PLAN_EN = Billions of francs go into tanks, aviation and artillery. Production grows, but the treasury empties year by year.
BE2_FD_FRA_FRONT = Коммунисты и социалисты входят в правительство. Страна сплачивается вокруг общей обороны, единство народа крепнет.
BE2_FD_FRA_FRONT_EN = Communists and socialists enter the government. The country rallies around common defence and national unity grows.
BE2_FD_FRA_MAGINOT = На восточной границе строится непробиваемая линия укреплений. Оборонительный щит должен остановить врага без боя.
BE2_FD_FRA_MAGINOT_EN = An impregnable line of fortifications is built on the eastern border. The defensive shield is meant to stop the enemy without a fight.
BE2_FD_FRA_SCHOOL = Школы и университеты получают государственный заказ. Инженерные кадры готовятся десятилетиями — и находят применение в армии.
BE2_FD_FRA_SCHOOL_EN = Schools and universities receive a state order. Engineers are trained for decades - and find their use in the army.
BE2_FD_FRA_INDUSTRY = Заводы и шахты переходят под государственный контроль. Франция становится второй промышленной державой континента.
BE2_FD_FRA_INDUSTRY_EN = Factories and mines come under state control. France becomes the second industrial power of the continent.
BE2_FD_FRA_COLONIES = Колонии от Африки до Индокитая приносят доход и ресурсы. Подданные на пяти континентах, флаг — над половиной мира.
BE2_FD_FRA_COLONIES_EN = Colonies from Africa to Indochina bring income and resources. Subjects on five continents, the flag over half the world.
BE2_FD_FRA_DUNKERQUE = Сорок тысяч солдат уходят из-под удара на британские корабли. Армия спасена ценой обстрела собственных городов.
BE2_FD_FRA_DUNKERQUE_EN = Forty thousand soldiers leave under fire onto British ships. The army is saved at the price of shelling its own towns.
BE2_FD_FRA_BATTLE = Фронт стоит насмерть. Города горят, но наступление останавливается — и парижское правительство уходит в изгнание.
BE2_FD_FRA_BATTLE_EN = The front stands to the last. Towns burn, but the offensive is stopped - and the Paris government goes into exile.
BE2_FD_FRA_FREE = Из Лондона звучит голос правительства в изгнании. Форпора поднимает колонии, и о тетрах вспоминают даже те, кто не хотел воевать.
BE2_FD_FRA_FREE_EN = From London comes the voice of the government in exile. The France Libre rallies the colonies and even the unwilling remember the oaths.
BE2_FD_FRA_GB = Англия признаёт правительство в изгнании. Общий флот, общая казна, общий враг — союз скрепляется.
BE2_FD_FRA_GB_EN = Britain recognises the government in exile. Shared fleet, shared treasury, shared enemy - the alliance is sealed.
BE2_FD_FRA_CHATEAU = Новое правительство уступает влияние старой элите. Буржуазия поддерживает режим - ценой уступок и перемирия.
BE2_FD_FRA_CHATEAU_EN = The new government concedes influence to the old elite. The bourgeoisie backs the regime - at the price of concessions and armistice.
BE2_FD_FRA_CIVILWAR = Страна раскалывается надвое: за власть в изгнании и против, за Париж и Виши. Провинции переходят к мятежникам, они объявляют войну правительству - и страна получает гражданскую войну.
BE2_FD_FRA_CIVILWAR_EN = The country splits in two: for and against the government in exile, for Paris and for Vichy. Provinces go over to the rebels, they declare war on the government - and the country gets a civil war.
BE2_FD_FRA_RESISTANCE = Подполье и партизаны ведут войну без армии. Границы страны перестают быть границами.
BE2_FD_FRA_RESISTANCE_EN = The underground and the partisans wage war without an army. The borders of the country stop being borders.
BE2_FD_FRA_LIBERATION = Страна возвращена. Союзники входят в Париж, и Франция вновь становится великой державой.
BE2_FD_FRA_LIBERATION_EN = The country is retaken. The allies enter Paris and France becomes a great power once again.
BE2_FD_FRA_ATOM = Комиссия по атомной энергии получает неограниченный бюджет и секретность уровня государственной тайны.
BE2_FD_FRA_ATOM_EN = The atomic energy commission gets an unlimited budget and state-level secrecy.
BE2_FD_FRA_AFRIQUE = Экваториальная и Западная Африка становятся военной базой. Ресурсы идут на фронт, а не в метрополию.
BE2_FD_FRA_AFRIQUE_EN = Equatorial and West Africa become a military base. Resources go to the front, not to the metropole.
BE2_FD_FRA_UNION = Метрополия, колонии и доминионы связаны в одно государство. Подданные на всех континентах под одним флагом.
BE2_FD_FRA_UNION_EN = Metropole, colonies and dominions are bound into one state. Subjects on every continent under a single flag.
BE2_FD_FRA_PUISSANCE = Франция вновь в числе первых держав мира. Океанские флоты, ядерный арсенал, империя - наступает новая эпоха.
BE2_FD_FRA_PUISSANCE_EN = France is once again among the first powers of the world. Ocean fleets, a nuclear arsenal, an empire - a new era begins.

