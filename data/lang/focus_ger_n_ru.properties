# Переводы фокусов Германской монархии (ger_n) - 35 фокусов.
# Вливается в game/languages/focus/Bundle_ru.properties скриптом tools/merge_props.py.

# ===================== КОРНИ =====================
BE2_F_GERN_KAISER = Возвращение кайзера
BE2_F_GERN_KAISER_EN = Return of the Kaiser
BE2_FD_GERN_KAISER = Кронпринц вновь занимает трон после гражданской войны: войска присягают короне, а страна видит обещанный порядок. Прочность власти растёт, мобильный резерв и армия получают первые силы, народ на стороне трона.
BE2_FD_GERN_KAISER_EN = The crown prince takes the throne again after the civil war: the troops swear to the crown and the country sees the promised order. Power grows, the manpower pool and the army receive their first strength, and the people back the throne.

BE2_F_GERN_REICHSTAG = Созыв рейхстага
BE2_F_GERN_REICHSTAG_EN = Convening the Reichstag
BE2_FD_GERN_REICHSTAG = Впервые за годы в Берлине собирается выборное собрание: корона обещает конституцию и общие законы. Созыв обходится казне дорого, зато дипломатия и доверие соседей растут, а внутри страны крепнет прочность власти.
BE2_FD_GERN_REICHSTAG_EN = For the first time in years a chosen assembly meets in Berlin: the crown promises a constitution and common law. The session costs the treasury dearly, but diplomacy and the trust of the neighbours grow, and the state becomes more solid at home.

BE2_F_GERN_KRONPRINZ = Регентство крона
BE2_F_GERN_KRONPRINZ_EN = Regency of the Crown Prince
BE2_FD_GERN_KRONPRINZ = Армия переходит под руку кронпринца и перестаёт быть орудием партийных комитетов. Содержание армии падает, а её натиск и число солдат растут: государство снова опирается на войска.
BE2_FD_GERN_KRONPRINZ_EN = The army passes into the hands of the crown prince and stops being a tool of the party committees. Army upkeep falls while its punch and its numbers grow: the state stands on its troops again.

BE2_F_GERN_WIEDERBAU = Восстановление разрушенного
BE2_F_GERN_WIEDERBAU_EN = Reconstruction
BE2_FD_GERN_WIEDERBAU = Разбомлённые города, мосты и электростанции поднимают заново: стройки требуют денег, и казна уходит в минус. Зато рост экономики и производство остаются с страной надолго, а измотанные города оживают.
BE2_FD_GERN_WIEDERBAU_EN = Bombed cities, bridges and power stations are raised again: building sites demand money and the treasury goes into the red. In return economic growth and production stay with the country for a long time, and the worn-out cities come back to life.

BE2_F_GERN_KERN = Урановый проект
BE2_F_GERN_KERN_EN = The Uranium Project
BE2_FD_GERN_KERN = Правительство открывает секретную лабораторию по расщеплению ядра: работают лучшие физики страны, а проект закрыт от чужих глаз. Исследования идут быстрее и страна получает научный перевес, но казна несёт постоянные расходы.
BE2_FD_GERN_KERN_EN = The government opens a secret laboratory for splitting the atomic nucleus: the best physicists of the country work there and the project is hidden from foreign eyes. Research moves faster and the country gains a scientific lead, but the treasury carries a constant expense.

# ===================== ГОСУДАРСТВЕННОСТЬ =====================
BE2_F_GERN_VERFASSUNG = Конституция и независимые суды
BE2_F_GERN_VERFASSUNG_EN = Constitution and Independent Courts
BE2_FD_GERN_VERFASSUNG = Текст конституции определяет права короны, собрания и земель, а суды перестают быть орудием исполнительной власти. Управление страной становится плотнее, народ видит закон, и казне это стоит немного.
BE2_FD_GERN_VERFASSUNG_EN = The constitution defines the rights of the crown, the assembly and the lands, and the courts stop being a tool of the executive. Administration becomes tighter, the people see the law, and it costs the treasury a little.

BE2_F_GERN_WAHLEN = Отмена однопартийности и выборы
BE2_F_GERN_WAHLEN_EN = Abolishing the Single Party and Elections
BE2_FD_GERN_WAHLEN = Единственная партия перестаёт быть источником власти, а голосование становится тайным и всеобщим. Прочность власти и дипломатия растут, страна получает признание соседей, народ доволен.
BE2_FD_GERN_WAHLEN_EN = The single party stops being the source of power and the vote becomes secret and universal. Stability and diplomacy grow, the country gains recognition from its neighbours, and the people are pleased.

BE2_F_GERN_GEWERKSCHAFTEN = Возвращение профсоюзов
BE2_F_GERN_GEWERKSCHAFTEN_EN = Return of the Trade Unions
BE2_FD_GERN_GEWERKSCHAFTEN = Профсоюзы снова получают право на забастовку и на договор с нанимателем, но не вмешиваются в управление страной. Производство и призывной ресурс растут, в казну поступают отчисления, а власть теряет часть контроля над заводом.
BE2_FD_GERN_GEWERKSCHAFTEN_EN = The trade unions get the right to strike and to bargain with the employer again, but no say in running the country. Production and the recruitable population grow, the treasury gets the workers' dues, and the government loses part of its control over the plant.

BE2_F_GERN_BUND = Федерация земель
BE2_F_GERN_BUND_EN = Federation of the Lands
BE2_FD_GERN_BUND = Земли получают представительство, налоги и часть полномочий, а Берлин перестаёт всё решать в одиночку. Управление страной становится плотнее, еды в стране больше, но часть элит недовольна потерей влияния.
BE2_FD_GERN_BUND_EN = The lands get representation, taxes and a share of authority, and Berlin stops deciding everything alone. Administration becomes tighter and the country has more food, but part of the elite is unhappy about losing influence.

BE2_F_GERN_KOLONIEN = Деколонизация и возвращение колоний
BE2_F_GERN_KOLONIEN_EN = Decolonisation and Return of the Colonies
BE2_FD_GERN_KOLONIEN = Тропические владения сначала признаны самоуправляемыми, а затем возвращены под мандат Берлина вместе с портами и плантациями. Мир видит в этом уступку, дипломатия и еда растут, а в казну поступают доходы из тропиков.
BE2_FD_GERN_KOLONIEN_EN = The tropical possessions are first recognised as self-governing, then returned to the Berlin mandate together with their ports and plantations. The world reads this as a concession, diplomacy and food grow, and the treasury receives income from the tropics.

# ===================== ФОРМА ПРАВЛЕНИЯ =====================
BE2_F_GERN_ABSOLUT = Корона против рейхстага
BE2_F_GERN_ABSOLUT_EN = The Crown against the Reichstag
BE2_FD_GERN_ABSOLUT = Корона отменяет конституцию и собирает власть в одних руках: указы, повиновение армии, налоги без голосования. Страна становится единой и послушной, а народ недоволен и смотрит на двор с осторожностью.
BE2_FD_GERN_ABSOLUT_EN = The crown cancels the constitution and gathers all power in one pair of hands: decrees, an army that obeys, taxes without a vote. The country becomes united and obedient, while the people are displeased and watch the court warily.

BE2_F_GERN_REPUBLIK = Республиканский поворот
BE2_F_GERN_REPUBLIK_EN = The Republican Turn
BE2_FD_GERN_REPUBLIK = Собрание низлагает династию и объявляет Германию парламентской республикой с избираемым президентом. Управление страной становится плотнее, дипломатия растёт, а старый порядок уходит в прошлое.
BE2_FD_GERN_REPUBLIK_EN = The assembly dethrones the dynasty and proclaims Germany a parliamentary republic with an elected president. Administration becomes tighter, diplomacy grows and the old order passes into history.

BE2_F_GERN_BONAPART = Кронпринц-солдат
BE2_F_GERN_BONAPART_EN = The Soldier King
BE2_FD_GERN_BONAPART = Король-солдат берёт власть силой армии и правит один, опираясь на генералов и офицеров. Натиск и военные очки растут резко, а репутация короны падает.
BE2_FD_GERN_BONAPART_EN = A soldier-king seizes power with the army and rules alone, leaning on the generals and the officers. Assault and military points rise sharply, while the reputation of the crown falls.

# ===================== АРМИЯ =====================
BE2_F_GERN_GENERALSTAB = Генеральный штаб
BE2_F_GERN_GENERALSTAB_EN = The General Staff
BE2_FD_GERN_GENERALSTAB = Штабные офицеры перестраивают армию: единая система штабов, приказов, снабжения и разведки. Наступление и оборона становятся организованнее, а армия получает первые дополнительные очки.
BE2_FD_GERN_GENERALSTAB_EN = Staff officers rebuild the army: a single system of staffs, orders, supply and reconnaissance. Assault and defence become better organised and the army receives its first extra points.

BE2_F_GERN_PANZERSCHULE = Танковая школа
BE2_F_GERN_PANZERSCHULE_EN = The Tank School
BE2_FD_GERN_PANZERSCHULE = Крупнейшие танковые соединения собирают в одном месте: учения, ремонт, снабжение горючим и единая тактика. Удар и подвижность войск растут, а казна платит за технику и горючее.
BE2_FD_GERN_PANZERSCHULE_EN = The largest tank formations gather in one place: exercises, repair, fuel supply and a single doctrine. Strike power and mobility grow, and the treasury pays for machines and fuel.

BE2_F_GERN_LUFT = Воссоздание люфтваффе
BE2_F_GERN_LUFT_EN = Recreating the Air Force
BE2_FD_GERN_LUFT = Авиация снова становится отдельным родом войск: собственные части, школы и авиационные заводы. Удар с воздуха становится главным оружием войны, а казна считает каждый самолёт.
BE2_FD_GERN_LUFT_EN = The air force becomes a separate arm again: its own units, schools and aircraft plants. Air strike becomes the main weapon of war and the treasury counts every plane.

BE2_F_GERN_UBOOTE = Подводный флот
BE2_F_GERN_UBOOTE_EN = The Submarine Fleet
BE2_FD_GERN_UBOOTE = Верфи и базы строят боевые подводные лодки для охраны морских путей и береговой линии. Флот получает силу вдали от берега, но лодки дороги, и казна считает каждый рейс.
BE2_FD_GERN_UBOOTE_EN = Shipyards and bases build combat submarines to guard the sea lanes and the coastline. The fleet gains strength far from the shore, but the boats are expensive and the treasury counts every patrol.

BE2_F_GERN_WEHRREFORM = Призывная реформа и офицерский корпус
BE2_F_GERN_WEHRREFORM_EN = Conscription Reform and the Officer Corps
BE2_FD_GERN_WEHRREFORM = Служба становится короче, обучение длиннее, а офицерские школы готовят педагогов для армии. Призывной ресурс растёт, содержание армии падает, мирные семьи недовольны.
BE2_FD_GERN_WEHRREFORM_EN = Service becomes shorter and training longer, while the officer schools produce teachers for the army. The recruitable population grows, army upkeep falls and the peace-time families are displeased.

BE2_F_GERN_PARADE = Парад рейха
BE2_F_GERN_PARADE_EN = The Reich Parade
BE2_FD_GERN_PARADE = Города видят технику и строй на площадях: люди верят армии, а соседи пересчитывают её планы. Уважение к режиму растёт внутри страны, за границей оно превращается в осторожность.
BE2_FD_GERN_PARADE_EN = The cities see machines and ranks on the squares: the people believe in the army and the neighbours recalculate its plans. Respect for the regime grows inside the country and turns into caution abroad.

# ===================== ХОЗЯЙСТВО =====================
BE2_F_GERN_RUHR = Рурский уголь
BE2_F_GERN_RUHR_EN = Ruhr Coal
BE2_FD_GERN_RUHR = Рурский бассейн снова даёт стране уголь и сталь, а шахты и заводы работают без перебоев. Производство и сбор налогов растут, еды в стране больше, а металл идёт на военные заказы.
BE2_FD_GERN_RUHR_EN = The Ruhr basin gives the country coal and steel again, and the mines and works run without interruptions. Production and tax collection grow, the country has more food, and the metal goes into war orders.

BE2_F_GERN_AUTARKIE = Автаркия
BE2_F_GERN_AUTARKIE_EN = Autarky
BE2_FD_GERN_AUTARKIE = Страна закрывается от мирового рынка и производит всё сама: производство и валовой доход растут на десятилетие. Только чужие технологии приходят теперь медленно, и наука от этого страдает.
BE2_FD_GERN_AUTARKIE_EN = The country closes itself off from the world market and makes everything itself: production and gross income grow for a decade. Only foreign technology now arrives slowly, and research suffers from it.

BE2_F_GERN_INDUSTRIE = Рабочие законы и промышленные палаты
BE2_F_GERN_INDUSTRIE_EN = Labour Laws and Industrial Chambers
BE2_FD_GERN_INDUSTRIE = Шахты, металлургия и машиностроение переходят под управление отраслевых палат, а рабочие законы ограничивают произвол фабрик. Производство, налоги и рост экономики растут, а управление страной и рабочие недовольны.
BE2_FD_GERN_INDUSTRIE_EN = Mines, metallurgy and machine building pass under the management of the industrial chambers, and the labour laws restrain the arbitrariness of the factories. Production, taxes and economic growth rise, while administration and the workers stay displeased.

BE2_F_GERN_FRIEDRICHPLAN = План Фридриха
BE2_F_GERN_FRIEDRICHPLAN_EN = The Friedrich Plan
BE2_FD_GERN_FRIEDRICHPLAN = Пятилетний план: налоговая реформа, жильё для семей, уголь и сталь по плану, а не по рынку. Экономика, производство и управление страной дают больше всего за десятилетие, но стратегические отрасли остаются под контролем короны.
BE2_FD_GERN_FRIEDRICHPLAN_EN = A five-year plan: tax reform, housing for families, coal and steel by plan instead of by market. The economy, production and administration give the most in a decade, but the strategic industries stay under the crown's control.

# ===================== НАУКА =====================
BE2_F_GERN_REAKTOR = Первый реактор
BE2_F_GERN_REAKTOR_EN = The First Reactor
BE2_FD_GERN_REAKTOR = Первый реактор выводит страну на новый уровень науки и даёт ядерную бомбу раньше, чем кому-либо в мире. Исследования идут быстрее, а казна отдаёт на проект всё, что может.
BE2_FD_GERN_REAKTOR_EN = The first reactor takes the country to a new level of science and gives it the nuclear bomb earlier than anyone in the world. Research moves faster and the treasury gives the project everything it can.

BE2_F_GERN_DUESENFLIEGER = Реактивная авиация
BE2_F_GERN_DUESENFLIEGER_EN = Jet Aviation
BE2_FD_GERN_DUESENFLIEGER = Реактивные машины сходят с конвейера: скорость, высота и удар с воздуха меняют счёт боя. Армия становится быстрее и сильнее, а наука получает новый толчок.
BE2_FD_GERN_DUESENFLIEGER_EN = Jet machines come off the assembly line: speed, altitude and air strike change the score of battle. The army becomes faster and stronger, and science gets a new push.

BE2_F_GERN_RAKETEN = Ракетное оружие
BE2_F_GERN_RAKETEN_EN = Rocket Weapons
BE2_FD_GERN_RAKETEN = Реактивные ракеты выходят на стартовые позиции: дальний удар без прорыва фронта. Военные очки и натиск растут, но это самая дорогая программа в истории монархии.
BE2_FD_GERN_RAKETEN_EN = Jet rockets reach their launch positions: a long-range strike without breaking the front. Military points and assault grow, but this is the most expensive programme in the history of the monarchy.

BE2_F_GERN_HOCHSCHULE = Университеты, радио и медицина
BE2_F_GERN_HOCHSCHULE_EN = Universities, Radio and Medicine
BE2_FD_GERN_HOCHSCHULE = Институты, радио и кино получают деньги, а университеты и больницы — профессоров, лаборатории и новые здания. Исследования идут быстрее, а города перестают тонуть в болезнях.
BE2_FD_GERN_HOCHSCHULE_EN = Institutes, radio and cinema get money, while universities and hospitals get professors, laboratories and new buildings. Research moves faster and the cities stop drowning in disease.

# ===================== ВНЕШНЯЯ ПОЛИТИКА =====================
BE2_F_GERN_FREIWILLIGE = Немецкие добровольцы за рубежом
BE2_F_GERN_FREIWILLIGE_EN = German Volunteers Abroad
BE2_FD_GERN_FREIWILLIGE = Тысячи немцев уходят в чужие армии и наёмнические дружины, а Берлин не мешает им. Мобильный резерв и армия растут, но соседи считают такую политику угрозой, а мирные семьи недовольны.
BE2_FD_GERN_FREIWILLIGE_EN = Thousands of Germans leave for foreign armies and mercenary bands, and Berlin does not stop them. The manpower pool and the army grow, but the neighbours read such a policy as a threat and the peace-time families are displeased.

BE2_F_GERN_WESTBUND = Западный союз
BE2_F_GERN_WESTBUND_EN = The Western Bloc
BE2_FD_GERN_WESTBUND = Западные державы признают новое государство и открывают общий рынок: поезда, грузы, технологии. Дипломатия и доходы растут, а наука получает доступ к чужим открытиям.
BE2_FD_GERN_WESTBUND_EN = The western powers recognise the new state and open a common market: trains, goods, technology. Diplomacy and income grow, and science gains access to foreign discoveries.

BE2_F_GERN_NEUTRALITAET = Нейтралитет и демилитаризация
BE2_F_GERN_NEUTRALITAET_EN = Neutrality and Demilitarisation
BE2_FD_GERN_NEUTRALITAET = Германия объявляет себя нейтральной: тяжёлое оружие сдано, армия распущена, границу охраняют жандармы. Очки дипломатии и отношения со всеми странами растут, а наступление и оборона слабеют.
BE2_FD_GERN_NEUTRALITAET_EN = Germany declares itself neutral: heavy weapons are handed over, the army is disbanded and the border is guarded by gendarmes. Diplomacy points and relations with every country grow, while assault and defence weaken.

BE2_F_GERN_SPALTUNG = Раздел Германии
BE2_F_GERN_SPALTUNG_EN = The Division of Germany
BE2_FD_GERN_SPALTUNG = Страну режут по живому: земли, люди и заводы уходят под управление держав. Прочность власти и армия рушатся, народ в ярости, а казну опустошают контрибуции.
BE2_FD_GERN_SPALTUNG_EN = The country is cut to the quick: lands, people and works pass under foreign control. Stability and the army collapse, the people are furious, and reparations empty the treasury.

BE2_F_GERN_EINIGUNG = Объединение Германии
BE2_F_GERN_EINIGUNG_EN = The Unification of Germany
BE2_FD_GERN_EINIGUNG = Разорванные земли снова собираются в одно государство: рельсы, законы и армии становятся общими. Прочность власти, мобильный резерв и подвижность войск растут, народ ликует.
BE2_FD_GERN_EINIGUNG_EN = The torn lands gather into one state again: rails, laws and armies become common. Stability, the manpower pool and the mobility of the troops grow, and the people rejoice.

# ===================== ПОЗДНЯЯ ВЕТКА =====================
BE2_F_GERN_REVANCHE = Реваншизм
BE2_F_GERN_REVANCHE_EN = Revanchism
BE2_FD_GERN_REVANCHE = Страна берёт старые счета и готовит войну на истощение соседей. Натиск, армия и живое мясо растут, внутри страны поддержка высока, а мир становится холоднее.
BE2_FD_GERN_REVANCHE_EN = The country settles old scores and prepares a war of attrition against its neighbours. Assault, army and manpower grow, support at home is high and the world turns colder.

BE2_F_GERN_EUROPA = Европейский порядок
BE2_F_GERN_EUROPA_EN = The European Order
BE2_FD_GERN_EUROPA = Немецкая держава держит мир в Европе: общий рынок, единые границы, посредничество в чужих конфликтах. Дипломатия и доходы растут, а очки капитуляции увеличиваются вместе с уважением к Берлину.
BE2_FD_GERN_EUROPA_EN = The German power keeps peace in Europe: a common market, united borders, mediation in other people's conflicts. Diplomacy and income grow, and capitulation points rise together with the respect for Berlin.

BE2_F_GERN_BURGERKRIEG = Раскол монархии
BE2_F_GERN_BURGERKRIEG_EN = The Split of the Monarchy
BE2_FD_GERN_BURGERKRIEG = Генералы и князья поднимают мятеж против короны: страна делится надвое, а власть, деньги и люди уходят на гражданскую войну. Прочность власти рушится, народ разочарован, казна пустеет.
BE2_FD_GERN_BURGERKRIEG_EN = Generals and princes rise against the crown: the country splits in two, and power, money and people go into a civil war. Stability collapses, the people are disappointed and the treasury empties.
