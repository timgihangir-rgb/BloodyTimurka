# Переводы нового дерева фокусов Великобритании (35 фокусов, тег eng).
# Дерева для этой цивилизации в игре раньше не было.
# Вливается в game/languages/focus/Bundle_ru.properties скриптом tools/merge_props.py.

# ===================== КОРОЛЕВСКИЙ ФЛОТ И ПЕРЕВООРУЖЕНИЕ =====================
BE2_F_ENG_FLEET = Королевский флот
BE2_F_ENG_FLEET_EN = The Royal Navy
BE2_FD_ENG_FLEET = Девять эскадр переходят на новый строй, а казны идут в дизельные корабли и авианосцы. Флот получает тысячи очков армии и начинает быстрее перебрасывать войска через море.
BE2_FD_ENG_FLEET_EN = Nine squadrons are re-formed and the treasury pays for diesel warships and carriers. The fleet gains thousands of military points and starts moving troops across the sea faster.

BE2_F_ENG_FLEETBUILD = Программа эсминцев
BE2_F_ENG_FLEETBUILD_EN = The Destroyer Programme
BE2_FD_ENG_FLEETBUILD = Верфи закладывают десятки эсминцев и крейсеров, а старые линейные корабли уходят в отставку. Ударная сила флота растёт, и вся морская торговля мира идёт под защитой Лондона.
BE2_FD_ENG_FLEETBUILD_EN = Dozens of destroyers and cruisers are laid down and the old battleships are retired. The strike power of the fleet grows, and the whole world maritime trade passes under London's protection.

BE2_F_ENG_RAF = Королевские военно-воздушные силы
BE2_F_ENG_RAF_EN = The Royal Air Force
BE2_FD_ENG_RAF = Из имперской авиационной службы вырастает самостоятельная армия в небе: сотни самолётов, школа лётчиков и первая в мире система бомбардировочной авиации. Удар с воздуха становится главным оружием войны.
BE2_FD_ENG_RAF_EN = A separate service in the sky grows out of the imperial aviation: hundreds of aircraft, a flying school and the world's first bomber command. Air strike becomes the main weapon of war.

BE2_F_ENG_ARMY = Перевооружение армии
BE2_F_ENG_ARMY_EN = Rearmament of the Army
BE2_FD_ENG_ARMY = Суворовская армия довооружается: современные винтовки, мины и мобильные радиостанции вместо кавалерии и окопов. Призывной ресурс растёт, а удары армии становятся сильнее.
BE2_FD_ENG_ARMY_EN = The old army is rearmed: modern rifles, mines and mobile radios instead of cavalry and trenches. The pool of recruitable men grows and the army strikes harder.

BE2_F_ENG_TANKDESIGN = Производство танков
BE2_F_ENG_TANKDESIGN_EN = Tank Production
BE2_FD_ENG_TANKDESIGN = Заводы севера и средней полосы встают на выпуск тяжёлых машин. Броня и моторы идут на экспорт и в собственную армию: удар с земли становится таким же плотным, как удар с моря.
BE2_FD_ENG_TANKDESIGN_EN = Plants of the north and the Midlands switch to heavy machines. Armour and engines go both to export and to the home army: the blow from the land becomes as dense as the blow from the sea.

BE2_F_ENG_AIRDEFENCE = Противовоздушная оборона
BE2_F_ENG_AIRDEFENCE_EN = Air Defence
BE2_FD_ENG_AIRDEFENCE = Над Лондоном и портами разворачивается кольцо зенитных батарей, а в небе работает зенитная артиллерия. Прорыв к столице и к верфям стоит противнику слишком дорого.
BE2_FD_ENG_AIRDEFENCE_EN = A ring of anti-aircraft batteries is deployed over London and the ports, and flak guns work in the sky. A break to the capital and the shipyards costs the enemy too much.

BE2_F_ENG_DEFENCES = Укрепление метрополии и имперские базы
BE2_F_ENG_DEFENCES_EN = Home and Imperial Defences
BE2_FD_ENG_DEFENCES = Берега Ла-Манша и устья Темзы заливаются бетоном и минными полями, а в Сингапуре, Гибралтаре и Адене строятся гарнизоны. Оборона страны и заморских владений становится почти непреодолимой.
BE2_FD_ENG_DEFENCES_EN = The shores of the Channel and the mouth of the Thames are filled with concrete and minefields, and garrisons are built at Singapore, Gibraltar and Aden. The defence of the homeland and of the overseas possessions becomes almost impossible to break.

BE2_F_ENG_MOBILISATION = Мобилизация страны
BE2_F_ENG_MOBILISATION_EN = Mobilisation of the Country
BE2_FD_ENG_MOBILISATION = Всё мужское население от шестнадцати лет встаёт под ружьё, а заводы переходят на военные заказы. Мобильный резерв, очки армии и число способных к призыву вырастают в разы, но страна живёт на военных пайках.
BE2_FD_ENG_MOBILISATION_EN = The whole male population from sixteen years up is armed and the plants switch to war orders. The mobile reserve, the military points and the number of recruitable men grow many times over, but the country lives on military rations.

BE2_F_ENG_JUNTA = Хунта генералов
BE2_F_ENG_JUNTA_EN = The Generals' Committee
BE2_FD_ENG_JUNTA = Армейская верхушка смещает парламент и берёт власть в свои руки: страна переходит к правлению военных, ударная сила армии растёт, а дипломатия всего мира пересчитывает свои планы.
BE2_FD_ENG_JUNTA_EN = The army top removes the parliament and takes power into its own hands: the country passes under military rule, the strike power of the army grows and every diplomat in the world recalculates their plans.

# ===================== НАУКА И ПРОМЫШЛЕННОСТЬ =====================
BE2_F_ENG_INDUSTRY = Национальная промышленность
BE2_F_ENG_INDUSTRY_EN = National Industry
BE2_FD_ENG_INDUSTRY = Уголь, сталь и станки переходят под управление государства: шахты и заводы получают заказы напрямую, а не через посредников. Производство и рост экономики ускоряются на десятилетие.
BE2_FD_ENG_INDUSTRY_EN = Coal, steel and machine tools pass under state control: mines and plants get orders directly, not through middlemen. Production and economic growth speed up for a decade.

BE2_F_ENG_AIRCRAFTMARKET = Мировой авиационный рынок
BE2_F_ENG_AIRCRAFTMARKET_EN = The World Aircraft Market
BE2_FD_ENG_AIRCRAFTMARKET = Английские авиационные фирмы продают самолёты всем желающим и открывают рынок третьим странам. Казна получает доход с экспорта, а наука и производство растут на чужих заказах.
BE2_FD_ENG_AIRCRAFTMARKET_EN = British aircraft firms sell machines to anyone willing to buy and open the market to third countries. The treasury gets income from exports, and science and production grow on foreign orders.

BE2_F_ENG_AUTOMOBILE = Автомобилестроение
BE2_F_ENG_AUTOMOBILE_EN = The Motor Industry
BE2_FD_ENG_AUTOMOBILE = Дешёвые автомобили для всех, военные машины для армии и тракторы для ферм сходят с одного конвейера. Дороги, почта и перевозки ускоряются, а налоги с внутренней торговли идут в казну.
BE2_FD_ENG_AUTOMOBILE_EN = Cheap cars for everyone, military vehicles for the army and tractors for the farms all come off one conveyor line. Roads, post and transport get faster, and taxes on internal trade go to the treasury.

BE2_F_ENG_RADIOTV = Радио и телевидение
BE2_F_ENG_RADIOTV_EN = Radio and Television
BE2_FD_ENG_RADIOTV = Домашние приёмники, а затем телевизоры становятся нормой для каждой семьи. Страна узнаёт новости в тот же день, а исследования получают заказы от промышленности.
BE2_FD_ENG_RADIOTV_EN = Home receivers and then television sets become normal for every family. The country learns the news on the same day, and research gets orders from the industry.

BE2_F_ENG_TUBEALLOY = Урановая трубка
BE2_F_ENG_TUBEALLOY_EN = The Uranium Tube
BE2_FD_ENG_TUBEALLOY = Страна берётся за расщепление урана: в лабораториях Кембриджа и Ливерпуля строят установки и растворяют уран в стекле. Исследования идут вдвое быстрее, но казна платит за это полностью.
BE2_FD_ENG_TUBEALLOY_EN = The country takes up uranium splitting: plants are built in the laboratories of Cambridge and Liverpool and uranium is dissolved in glass. Research goes twice as fast, but the treasury pays for all of it.

BE2_F_ENG_JETPROGRAM = Реактивная авиация
BE2_F_ENG_JETPROGRAM_EN = The Jet Programme
BE2_FD_ENG_JETPROGRAM = Моторы, тяга и обтекаемые формы доводятся до реактивной машины, и истребители без винта выходят на боевые рубежи. Удар и скорость армии растут, а конструкторы и лётчики становятся золотым фондом страны.
BE2_FD_ENG_JETPROGRAM_EN = Engines, thrust and streamlining are brought to a jet machine and propelless fighters reach the front line. Strike and army speed grow, and designers and pilots become the country's most valuable asset.

BE2_F_ENG_RADAR = Радар
BE2_F_ENG_RADAR_EN = Radar
BE2_FD_ENG_RADAR = Ряды антенн вдоль побережья видят сто миль в любую погоду и ночью. Вражеская авиация больше не заходит незамеченной, оборона страны становится крепче, а наука получает ещё один толчок.
BE2_FD_ENG_RADAR_EN = Rows of masts along the coast see a hundred miles in any weather and at night. Enemy aviation no longer arrives unseen, the defence of the country hardens and science gets another push.

BE2_F_ENG_ATOMWEAPON = Атомная бомба
BE2_F_ENG_ATOMWEAPON_EN = The Atomic Bomb
BE2_FD_ENG_ATOMWEAPON = Расчёт заканчивается на полигоне в безлюдной степи, и страна получает оружие, против которого нет брони. Два заряда входят в арсенал, удары становятся сильнее, а весь мир считает заново свои планы.
BE2_FD_ENG_ATOMWEAPON_EN = The calculation ends at a proving ground in a lonely steppe and the country gets a weapon against which there is no armour. Two charges enter the arsenal, strikes grow heavier and the whole world counts its plans again.

# ===================== ИМПЕРИЯ =====================
BE2_F_ENG_EMPIRE = Имперская конференция
BE2_F_ENG_EMPIRE_EN = The Imperial Conference
BE2_FD_ENG_EMPIRE = Сорок лет независимых владений превращаются в единый организм: общие законы, единая оборона, общий флот, мандат в Палестине и протектораты под общим управлением. Управление страной становится плотнее, в казну идут доходы с заморских земель, а весь мир признаёт силу короны.
BE2_FD_ENG_EMPIRE_EN = Forty years of separate possessions turn into a single body: common laws, common defence, one fleet, the mandate in Palestine and the protectorates under one administration. Administration over the country tightens, income from the overseas lands flows to the treasury and the world acknowledges the power of the crown.

BE2_F_ENG_WESTMINSTER = Статут Вестминстера
BE2_F_ENG_WESTMINSTER_EN = The Statute of Westminster
BE2_FD_ENG_WESTMINSTER = Доминионы получают право собственных парламентов и внешней политики, но остаются в орбите короны. Канада, Австралия и Новая Зеландия перестают быть плательщиками, но приносят мореходство, зерно и золото.
BE2_FD_ENG_WESTMINSTER_EN = The dominions get their own parliaments and their own foreign policy, yet stay in the orbit of the crown. Canada, Australia and New Zealand stop being payers, but they bring seafaring, grain and gold.

BE2_F_ENG_INDIARULE = Самоуправление Индии
BE2_F_ENG_INDIARULE_EN = Government of India
BE2_FD_ENG_INDIARULE = Под давлением индийской агитации Лондон вводит в Индии своё выборное собрание и уступки местным, оставляя себе последнее слово. Управление в колонии становится сложнее, но казна наконец получает налоги с самой большой провинции.
BE2_FD_ENG_INDIARULE_EN = Under pressure of Indian agitation London sets up an elected assembly in India and concedes to the locals, keeping the last word. Administration in the colony grows harder, but the treasury finally gets taxes from its largest province.

BE2_F_ENG_INDIANFREE = Независимость Индии
BE2_F_ENG_INDIANFREE_EN = Independence of India
BE2_FD_ENG_INDIANFREE = Индия уходит из империи, и к золоту и пряже приходится искать новые рынки. В казну приходит выкуп за поставки, а страна теряет живую силу призыва и часть влияния в мире.
BE2_FD_ENG_INDIANFREE_EN = India leaves the empire and new markets have to be found for gold and textiles. The treasury receives a payment for the deliveries, and the country loses the manpool and part of its weight in the world.

BE2_F_ENG_AUSTRALIA = Австралия и Новая Зеландия
BE2_F_ENG_AUSTRALIA_EN = Australia and New Zealand
BE2_FD_ENG_AUSTRALIA = Дальние владения получают собственный флот, громоздкие суда и полк пилотов, нанятых в чужих странах. Моря и живые силы страны растут, а тихоокеанские порты становятся второй военной базой.
BE2_FD_ENG_AUSTRALIA_EN = The far possessions get their own fleet, big ships and a regiment of pilots hired abroad. Seaways and manpower grow, and the Pacific ports become a second war base.

BE2_F_ENG_DECOLONISATION = Деколонизация
BE2_F_ENG_DECOLONISATION_EN = Decolonisation
BE2_FD_ENG_DECOLONISATION = Мандат в Палестине, протектораты Африки и Азии уходят к правительствам мест. Вместо налогов приходит выкуп за привилегии, страна перестаёт раздражать весь мир, и народ видит смысл в отказе от империи.
BE2_FD_ENG_DECOLONISATION_EN = The mandate in Palestine and the protectorates of Africa and Asia pass to local governments. Instead of taxes there comes a payment for privileges, the country stops irritating the whole world and the people see sense in refusing the empire.

# ===================== ВНУТРЕННЯЯ ПОЛИТИКА =====================
BE2_F_ENG_WELFARE = Всеобщее страхование по болезни
BE2_F_ENG_WELFARE_EN = National Health Insurance
BE2_FD_ENG_WELFARE = Бедняки получают врача, лекарство и больничную койку за счёт казны, а армия перестаёт тратить деньги на разряженную старую систему. Люди довольны, призывной ресурс и обстановка в стране становятся спокойнее.
BE2_FD_ENG_WELFARE_EN = The poor get a doctor, medicine and a hospital bed at the expense of the treasury, and the army stops paying for the old decrepit system. People are glad, and the recruitable pool and the mood in the country grow calmer.

BE2_F_ENG_PENSIONS = Пенсии по старости
BE2_F_ENG_PENSIONS_EN = Old Age Pensions
BE2_FD_ENG_PENSIONS = Каждый, кто дожил до шестидесяти пяти, получает пенсию независимо от того, как он прожил жизнь. Власть держится прочнее, доверие народа крепнет, но содержание этой системы ложится на плечи плательщиков.
BE2_FD_ENG_PENSIONS_EN = Everyone who reaches sixty-five gets a pension no matter how he lived. Power holds together better, trust of the people hardens, but the cost of the system falls on the shoulders of the payers.

BE2_F_ENG_LABOURPARTY = Лейбористская партия
BE2_F_ENG_LABOURPARTY_EN = The Labour Party
BE2_FD_ENG_LABOURPARTY = Рабочие получают голос в парламенте, профсоюзы становятся силой, а палата лордов упраздняется. Страна переходит к правлению парламентского большинства, управление ею упрощается, и рабочий голос в цене.
BE2_FD_ENG_LABOURPARTY_EN = Workers get a voice in parliament, trade unions become a force and the house of lords is abolished. The country passes under the rule of the parliamentary majority, administration grows simpler and the working man's word gains weight.

BE2_F_ENG_SUFFRAGE = Всеобщие выборы
BE2_F_ENG_SUFFRAGE_EN = Universal Suffrage
BE2_FD_ENG_SUFFRAGE = Имущественный голос отменяется, а решения по важнейшим вопросам выносятся на всенародное голосование. Страна живёт по воле избирателей, дух народа поднимается, а экономика получает толчок от общих дел.
BE2_FD_ENG_SUFFRAGE_EN = The property vote is abolished and the most important questions are put to a vote of the whole people. The country lives by the will of the voters, the spirit of the people rises and the economy gets a push from common business.

BE2_F_ENG_TAXREFORM = Налоговая реформа
BE2_F_ENG_TAXREFORM_EN = Tax Reform
BE2_FD_ENG_TAXREFORM = Подать перестают собирать по частным договорам: общий сбор берёт больше с крупных состояний и меньше с мелких торговцев. В казну идут новые деньги, но сэкономленные бедняки возвращают своё недовольство.
BE2_FD_ENG_TAXREFORM_EN = Taxes stop being collected by private bargains: the common collector takes more from large estates and less from small traders. New money comes to the treasury, but the spared poor take their discontent back.

# ===================== ВНЕШНЯЯ ПОЛИТИКА =====================
BE2_F_ENG_PEACE = Умиротворение
BE2_F_ENG_PEACE_EN = Appeasement
BE2_FD_ENG_PEACE = Страна платит за спокойствие: договоры, уступки и удержание от армии обходятся дешевле, чем война. Мир относятся к Лондону с уважением, а содержание армии и оборонные расходы можно урезать.
BE2_FD_ENG_PEACE_EN = The country pays for peace: treaties, concessions and keeping the army idle cost less than war. The world regards London with respect, and the upkeep of the army and the defence spending can be cut.

BE2_F_ENG_POLAND = Гарантии Польше
BE2_F_ENG_POLAND_EN = The Polish Guarantee
BE2_FD_ENG_POLAND = Лондон берёт на себя обязательство защитить польскую границу и обязывается двинуть против агрессора в Западной Европе. Дипломатический вес страны растёт, но Берлин считает это прямой враждой.
BE2_FD_ENG_POLAND_EN = London takes on the obligation to defend the Polish border and undertakes to move against the aggressor in Western Europe. The diplomatic weight of the country grows, but Berlin counts it as direct hostility.

BE2_F_ENG_SOVIETPACT = Договор с Советским Союзом
BE2_F_ENG_SOVIETPACT_EN = The Soviet Agreement
BE2_FD_ENG_SOVIETPACT = Вместо одиночного сближения с Соединёнными Штатами Лондон ведёт переговоры с Москвой о разделении сфер интересов. Восток и Запад начинают считать Лондон своим, и очки дипломатии растут.
BE2_FD_ENG_SOVIETPACT_EN = Instead of a single rapprochement with the United States, London negotiates with Moscow about dividing the spheres of interest. East and West begin to count London as their own, and the diplomatic points grow.

BE2_F_ENG_ALLIANCEUS = Союз с Соединёнными Штатами
BE2_F_ENG_ALLIANCEUS_EN = The American Alliance
BE2_FD_ENG_ALLIANCEUS = Заокеанский сосед признаёт морскую державу равной и садится за один стол: кредиты, базы, совместные кампании. Очки армии и дипломатии растут, а весь мир видит единый фронт против агрессора.
BE2_FD_ENG_ALLIANCEUS_EN = The neighbour across the ocean recognises the sea power as its equal and sits at one table: credits, bases, common campaigns. Military and diplomatic points grow and the whole world sees a single front against the aggressor.

BE2_F_ENG_ATLANTIC = Атлантическая хартия
BE2_F_ENG_ATLANTIC_EN = The Atlantic Charter
BE2_FD_ENG_ATLANTIC = Свободные конвои перевозят зерно, нефть и лес из-за океана под охраной флота и подводных лодок. Производство и армия растут на чужих берегах, но ломается вся привычная торговля.
BE2_FD_ENG_ATLANTIC_EN = Free convoys carry grain, oil and timber from across the ocean under the guard of the fleet and the submarines. Production and the army grow on foreign shores, but all the old familiar trade breaks.

BE2_F_ENG_UN = ООН и военный союз
BE2_F_ENG_UN_EN = The United Nations and the Alliance
BE2_FD_ENG_UN = По итогам войны в Сан-Франциско подписывается устав нового всемирного союза, а следом создаётся и военный блок в Европе. Дипломатические очки и армия идут вверх, страна получает постоянное место среди первых, а мир делится на зоны её влияния.
BE2_FD_ENG_UN_EN = After the war the charter of a new world union is signed in San Francisco, and a military bloc in Europe follows it. Diplomatic points and the army go up, the country gets a permanent place among the first, and the world is divided into zones of its influence.

# ===================== ФИНАЛ =====================
BE2_F_ENG_CIVILWAR = Раскол Британии
BE2_F_ENG_CIVILWAR_EN = The Fracture of Britain
BE2_FD_ENG_CIVILWAR = Фашистские ячейки, двадцать лет бурившие страну изнутри, поднимают мятеж на юге: от корнволлского берега до Темзы поднимаются чёрные знамёна, и юг Англии уходит из-под лондонского центра к новым хозяевам. Север, Шотландия и Уэльс остаются за старым правительством, а вы теперь играете за тех, кто поднял знамя.
BE2_FD_ENG_CIVILWAR_EN = Fascist cells that have been burrowing for twenty years rise in the south of the country: from the Cornish coast up to the Thames, black banners go up, and southern England leaves London to its new masters. The north, Scotland and Wales stay with Whitehall, and from now on you play for those who raised the flag.
